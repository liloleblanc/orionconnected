# Keeps the NVIDIA X screen stable when the KVM switches this PC away.
# DFP-4 is the DisplayPort socket of the desktop monitor (X output DP-2).
# The EDID file is copied from /sys/class/drm/card1-DP-2/edid when this is installed.
# Rollback: sudo rm -f /etc/X11/xorg.conf.d/20-fids-kvm.conf && sudo systemctl restart gdm
Section "OutputClass"
    Identifier  "fids-kvm-nvidia"
    MatchDriver "nvidia-drm"
    Driver      "nvidia"
    ModulePath  "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    Option      "ConnectedMonitor" "DFP-4"
    Option      "CustomEDID" "DFP-4:/etc/X11/edid/dfp-4.bin"
    Option      "LimitFrameRateWhenHeadless" "false"
EndSection

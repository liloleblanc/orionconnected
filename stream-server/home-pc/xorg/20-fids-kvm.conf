# Keeps the NVIDIA X screen stable when the KVM switches this PC away.
# apply-kvm-xorg.sh fills in the ConnectedMonitor and CustomEDID values below
# from MONITORS, for example "DFP-4" and "DFP-4:/etc/X11/edid/dfp-4.bin" for
# one monitor on X output DP-2.
# Every DisplayPort output in use must be listed: ConnectedMonitor overrides
# detection, so an output left out stays dark.
# Rollback: sudo /opt/fids-home/xorg/apply-kvm-xorg.sh --rollback
#   or by hand: sudo rm -f /etc/X11/xorg.conf.d/20-fids-kvm.conf && sudo systemctl restart gdm
Section "OutputClass"
    Identifier  "fids-kvm-nvidia"
    MatchDriver "nvidia-drm"
    Driver      "nvidia"
    ModulePath  "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    Option      "ConnectedMonitor" "@CONNECTED@"
    Option      "CustomEDID" "@EDIDS@"
    Option      "LimitFrameRateWhenHeadless" "false"
EndSection

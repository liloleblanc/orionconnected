<!DOCTYPE html>
<html lang="en">
<head>
  <!-- v23803 — orionconnected.app IS THE APP.
       This page is the opener: it paints, then replaces itself with a board.
       On the .app domain it should hand over to the Airport Companion instead.
       Done here rather than in the Worker because static assets are served
       BEFORE the Worker runs — no run_worker_first — so the Worker never sees
       a request for "/" at all and cannot route on the Host header.

       First in the head, ahead of even the theme resolve: on .app the theme
       belongs to the page we are leaving, and reading it first only delays the
       handover by a frame. -->
  <script>
  (function () {
    try {
      var h = String(location.hostname || "").toLowerCase();
      // v23808 — .app MEANS THE APP ALL THE WAY DOWN, not just at the root.
      // It was the apex and www only, which made the domain mean the app at one
      // level and the board at every other. A domain that changes its mind a
      // level down is not a shortcut, it is a trap — and the per-airport form is
      // the one worth handing out: yqm.orionconnected.app is what goes on a
      // poster or a QR code at a gate. The board keeps yqm.orionconnected.com.
      if (h === "orionconnected.app" || /\.orionconnected\.app$/.test(h)) {
        // replace(), not assign(): the opener must not sit in history, or Back
        // from the app lands on a page whose only job is to leave again.
        location.replace("/app" + location.search + location.hash);
      }
    } catch (e) {}
  })();
  </script>

  <!-- v23161 — BOOT THEME RESOLVES BEFORE FIRST PAINT. Same treatment as
       fids/gids/bids. This page was missed in v23159, and it is the page a
       display actually OPENS on: index.html paints, then location.replace()s to
       fids.html. Without this it painted white first, so every open began with
       a white frame before the board's own boot even started — one of the
 flashes the owner counts when a screen comes on. -->
  <script>
  (function () {
    try {
      var t = localStorage.getItem('fids_console_theme');
      if (t !== 'light' && t !== 'dark') {
        var h = new Date().getHours();
        t = (h >= 6 && h < 19) ? 'light' : 'dark';
      }
      var r = document.documentElement;
      /* v23163 — A SCREEN WITH NO MEMORY MUST NOT GUESS WHITE. The theme above
         is the CONSOLE preference, and with nothing saved it falls back to the
         hour: light between 06:00 and 19:00. The board it is about to cover is
         rgb(13,77,139) at every hour of the day, so on a display booting cold
         in daylight that guess put a full white screen up for the ten seconds
         the board takes to fill, then cut to blue. Measured on production:
         brightness 201 held from 3.7s to 14.0s.
         The board's ground is knowable, so it is the fallback now rather than
         the clock. fids_boot_ground still overrides it the moment a real board
         has reported its own colour, which is what makes this correct for a
         light board too. */
      var _learned = null;
      try {
        var _g = localStorage.getItem('fids_boot_ground');
        if (_g && /\d+\s*,\s*\d+\s*,\s*\d+/.test(_g)) _learned = _g;
      } catch (e) {}
      if (!_learned) t = 'dark';
      r.setAttribute('data-theme', t);
      r.style.background = _learned || 'rgb(13,77,139)';
      /* If a board has already recorded its own ground, this entry page paints
         straight into it, so the hand-off to fids.html has no colour change at
         all. */
      var g = localStorage.getItem('fids_boot_ground');
      if (g && /\d+\s*,\s*\d+\s*,\s*\d+/.test(g)) r.style.background = g;
    } catch (e) {}
  })();
  </script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIDS — Airport Display System v8</title>
  <!-- Auto-router for fids.orionconnected.com (runs in <head> before paint so
       the entry screen never flashes):
         • phones / tablets  → ASK, then the app on .app, or stay on the board
         • desktop / displays → fids.html?mode=live  (LIVE main FIDS board)
       Escape hatches: ?entry=1 keeps the DEMO/LOGIN entry screen (admin),
       ?nomobile=1 forces the desktop board on a phone.

       v23808 — THE MOBILE BRANCH ASKS NOW INSTEAD OF DECIDING.
       It used to location.replace() a phone straight to app.html, silently, on
       whatever domain it arrived on. Two things were wrong with that.

       The redirect was a hijack. Board links get shared deliberately — someone
       on a phone checking a departure board, or looking at a screen they are
       about to point a TV at, was taken somewhere else with no way back except
       a query string they would have to know about.

       And the test below is wider than "a phone": `w < 700` catches a desktop
       browser in a narrow window, which is a real way to end up in the
       passenger app while sitting at a keyboard. That was invisible because
       there was nothing to notice — the entry screen never painted.

       So it offers, and the offer remembers. Answer once and you are never
       asked again on that domain; ?nomobile=1 still forces the board without
       asking at all, for anything scripted.

       The app lives on .app, so YES leaves this origin. That means the two
       domains remember separately — a preference is per-origin and cannot be
       read across — which is the right shape anyway: the answer to "do you want
       the app" is only meaningful on the domain that is not the app. -->
  <script>
    (function(){
      try{
        var qs = location.search || '';
        if (/[?&]entry=1/.test(qs)) return;           // admin: keep the entry/login screen

        /* v23812 — NEVER ASK ON THE .app ZONE. That domain IS the app, and the
           handover at the top of this head has already decided; the question
           does not apply there.

           Left unguarded it ran anyway, and the answers were worse than the
           question. "Stay on the regular site" sent a phone to
           fids.html?mode=live ON orionconnected.app — the full board, on the
           app's own domain, which is what "it sticks with the full site"
           turned out to be. And "use the mobile app" resolved to
           https://orionconnected.app/ with the same query string the page was
           already showing: a replace() onto itself.

           It was invisible from the .com side because the offer worked
           perfectly there. The damage happened one hop later, on the domain
           the answer sent you to, where a second copy of the same question had
           no idea it had already been answered. */
        if (/(^|\.)orionconnected\.app$/.test(String(location.hostname || '').toLowerCase())) return;
        var apM = qs.match(/[?&]ap=([^&]+)/);
        var board = 'fids.html?mode=live' + (apM ? '&ap=' + apM[1] : '');

        var ua = navigator.userAgent || '';
        var w  = window.innerWidth || document.documentElement.clientWidth || 0;
        var isMobile = /Mobi|Android|iPhone|iPad|iPod|Windows Phone/i.test(ua) || w < 700;

        // Desktop/displays → LIVE main board. Don't force an airport: carry a
        // root ?ap= if present, otherwise let the board use its own
        // saved/selected airport (works for ALL airports, not locked to YQM).
        if (!isMobile) { location.replace(board); return; }

        /* Everything past here is a phone, or a window narrow enough to look
           like one — and THE BOARD HANDS PHONES OFF TOO. fids-core.js runs its
           own handoff on every board page (fids/gids/bids) and replaces itself
           with app.html for any real phone. So "go to the board" from here is
           not enough on its own: without the override the board bounces
           straight back into the app, and "stay on the regular site" becomes a
           button that does the opposite of what it says.

           That handoff reads the same ?nomobile=1 this page does, so carrying
           it forward is the whole fix — and it repairs ?nomobile=1 from the
           root as a side effect. It was dropped when this page built the board
           URL, so on a real phone the documented escape hatch got you to
           fids.html and no further: the board handed you to the app a moment
           later. It only ever worked if you typed fids.html yourself. */
        var stay = board + '&nomobile=1';

        if (/[?&]nomobile=1/.test(qs)) { location.replace(stay); return; }

        /* Where the app lives, for whoever is standing on this domain.

           The pretty form is yqm.orionconnected.app, and that is what this
           becomes the day the wildcard DNS record exists on the .app zone.
           Until then the subdomain does not resolve AT ALL — no record, so it
           never even reaches Cloudflare — and sending a phone there would be a
           dead host. The apex does resolve, and carries the airport just as
           well in a query string, so that is the honest target for now.

           The label is read crudely on purpose. host-airport.js is the
           authority for anything that routes a BOARD, and it is deliberately
           not loaded here: it would be a blocking request in the head of the
           one page whose whole job is to paint the right colour and leave. The
           cost of being wrong here is only that the app opens on its own saved
           airport, because app.html sanitises ?ap= and falls back on anything
           it does not recognise. A wrong guess is a soft landing, not a wrong
           board. */
        var host = String(location.hostname || '').toLowerCase();
        var parts = host.split('.');
        var label = parts.length > 2 ? parts[0] : '';
        if (label === 'www' || label === 'fids' || label === 'app') label = '';
        var ap = apM ? decodeURIComponent(apM[1]) : label;
        // SAME ORIGIN. /app is the Companion, and it is the address that was
        // actually confirmed working: fids.orionconnected.com/app?ap=MCO.
        //
        // This used to hop to https://orionconnected.app/ instead, and the hop
        // is what broke. It costs a cross-origin navigation, a second copy of
        // this very page on the far side, and a preference that cannot be read
        // back because it was stored on the origin you just left. The .app
        // domain still IS the app — its apex hands over to /app exactly as
        // before — but that is a thing you can type, not a detour the offer
        // needs to take.
        var app = '/app'
                + (ap ? '?ap=' + encodeURIComponent(String(ap).toUpperCase()) : '');

        // An answer is durable, so there has to be a way back to the question.
        // Without one, "stay on the regular site" is a decision you can only
        // undo by knowing how to clear site data.
        var pref = '';
        if (/[?&]mobile=ask/.test(qs)) {
          try { localStorage.removeItem('oc_mobile_pref'); } catch(e){}
        } else {
          try { pref = localStorage.getItem('oc_mobile_pref') || ''; } catch(e){}
        }
        if (pref === 'site') { location.replace(stay); return; }
        if (pref === 'app')  { location.replace(app);   return; }

        // Undecided. Hold the page and let the offer paint over the board's own
        // ground, which the theme script above has already put up — so this
        // reads as the page arriving, not as a flash then a dialog.
        window.__ocOffer = { app: app, board: stay };
        document.documentElement.setAttribute('data-oc-offer', '1');
      }catch(e){}
    })();
  </script>
  <style>

    html[data-oc-offer="1"] body > *:not(#ocOffer) { display: none !important; }
    #ocOffer { display: none; }

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     v23808 — THE MOBILE OFFER. Only ever painted when the head script above
     decided this is a phone AND nobody has answered on this domain before.

     Both languages, always. French first at the Québec airports, which is the
     standing rule for anything a passenger reads; everywhere else English
     leads and French follows. This is the only passenger-facing prompt on the
     opener, so it is the one place that rule could go unnoticed.
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="ocOffer" role="dialog" aria-modal="true" aria-labelledby="ocOfferQ">
  <div class="ocq" id="ocOfferQ"></div>
  <div class="ocbtns">
    <button type="button" class="ocyes" id="ocOfferYes"></button>
    <button type="button" class="ocno"  id="ocOfferNo"></button>
  </div>
  <small id="ocOfferNote"></small>
</div>
<script>
(function () {
  try {
    if (document.documentElement.getAttribute('data-oc-offer') !== '1') return;
    var o = window.__ocOffer || {};

    // Québec. The rule is about the province, not the language of the device —
    // a phone set to English standing in Montréal still reads French first.
    var QC = { YUL: 1, YQB: 1, YHU: 1, YMX: 1 };
    var ap = '';
    try { ap = (new URL(o.app, location.href)).searchParams.get('ap') || ''; } catch (e) {}
    var frFirst = !!QC[ap.toUpperCase()];

    var EN = {
      q: 'Open the mobile app?',
      yes: 'Use the mobile app',
      no: 'Stay on the regular site',
      note: 'We’ll remember your choice. Add <b class="nb">?mobile=ask</b> to be asked again.'
    };
    var FR = {
      q: 'Ouvrir l’application mobile ?',
      yes: 'Utiliser l’application mobile',
      no: 'Rester sur le site normal',
      note: 'Votre choix sera retenu. Ajoutez <b class="nb">?mobile=ask</b> pour qu’on vous redemande.'
    };
    var a = frFirst ? FR : EN, b = frFirst ? EN : FR;

    function two(k) {
      return '<span>' + a[k] + '</span><span>' + b[k] + '</span>';
    }
    document.getElementById('ocOfferQ').innerHTML = two('q');
    document.getElementById('ocOfferYes').innerHTML = two('yes');
    document.getElementById('ocOfferNo').innerHTML = two('no');
    document.getElementById('ocOfferNote').innerHTML = a.note;

    function answer(pref, to) {
      try { localStorage.setItem('oc_mobile_pref', pref); } catch (e) {}
      // replace(), not assign(): the offer must not sit in history, or Back
      // from either destination lands on a question already answered.
      location.replace(to);
    }
    document.getElementById('ocOfferYes').addEventListener('click', function () { answer('app', o.app); });
    document.getElementById('ocOfferNo').addEventListener('click', function () { answer('site', o.board); });
    document.getElementById('ocOfferYes').focus();
  } catch (e) {
    // If anything here fails the question can never be answered, so fall back
    // to the destination that loses nothing: the board this domain is for.
    try {
      document.documentElement.removeAttribute('data-oc-offer');
      location.replace((window.__ocOffer || {}).board || 'fids.html?mode=live');
    } catch (e2) {}
  }
})();
</script>

      #entryScreen .ocb-stage{ align-items:center; text-align:center; padding-top:clamp(24px,4vh,48px); }
      #entryScreen .ocb-actions{ justify-content:center; }
    }
  </style>

  <script>
  (function(){
    var root = document.currentScript.closest('#entryScreen');
    if(!root || root._ocbInit) return; root._ocbInit = true;
    var GREET = [["EN","Welcome"],["FR","Bienvenue"],["ES","Bienvenido"],["DE","Willkommen"],["PT","Bem-vindo"],["中文","欢迎"]];
    var heroEl = root.querySelector('#ocbHero');
    var langsEl = root.querySelector('#ocbLangs');
    GREET.forEach(function(g){ var s=document.createElement('span'); s.className='ocb-lang'; s.textContent=g[0]; langsEl.appendChild(s); });
    var chips = langsEl.children;
    heroEl.textContent = GREET[0][1]; chips[0].classList.add('is-on');
    var i = 0;
    setInterval(function(){
      i=(i+1)%GREET.length;
      heroEl.classList.add('is-swap');
      setTimeout(function(){
        heroEl.textContent = GREET[i][1];
        for(var k=0;k<chips.length;k++) chips[k].classList.toggle('is-on', k===i);
        heroEl.classList.remove('is-swap');
      }, 260);
    }, 2800);
  })();
  </script>
</div>

<div id="loginOverlay" class="login-overlay">

    <div class="ocb-login-actions">

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     SCRIPTS
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<script src="js/auth.js?v=23170"></script>
<script>
  // ── Entry Actions ─────────────────────────────────────────────────────

  function enterDemo() {
    // No auth needed — go straight to picker in demo mode
    sessionStorage.setItem('fids_mode', 'demo');
    window.location.href = 'picker.html';
  }

  function showLogin() {
    document.getElementById('loginOverlay').classList.add('open');
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    setTimeout(() => document.getElementById('loginUser').focus(), 200);
  }

  function hideLogin() {
    document.getElementById('loginOverlay').classList.remove('open');
  }

  async function attemptLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const errEl = document.getElementById('loginError');

    if (!user || !pass) {
      errEl.textContent = 'Please enter username and password';
      errEl.classList.add('show');
      return;
    }

    // Show loading state
    const submitBtn = document.querySelector('.login-btn-submit');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = '...';
    submitBtn.disabled = true;

    const result = await Auth.login(user, pass);

    submitBtn.textContent = originalText;
    submitBtn.disabled = false;

    if (result.success) {
      sessionStorage.setItem('fids_mode', 'live');
      // Fade out and navigate
      document.getElementById('loginOverlay').classList.remove('open');
      document.getElementById('entryScreen').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'picker.html';
      }, 400);
    } else {
      errEl.textContent = result.error || 'Invalid credentials / Identifiants invalides';
      errEl.classList.add('show');
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  }

  // ── Keyboard ──────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const overlay = document.getElementById('loginOverlay');
      if (overlay.classList.contains('open')) hideLogin();
    }
  });

  // ── Check for existing session ────────────────────────────────────────
  // v23811 — NOT WHILE A QUESTION IS OPEN.
  //
  // This jump is older than the mobile offer and never used to collide with
  // anything: the head redirected a phone to the app BEFORE the body ran, so
  // on a phone this line was unreachable. The offer holds the page instead of
  // leaving it, and the moment it does, a signed-in session lands here and
  // navigates away out from under the question — the offer paints, then the
  // picker replaces it, with no way to answer.
  //
  // Only phones are affected, because only phones are asked. A desktop never
  // raises the offer, so the attribute is absent and this behaves exactly as
  // it always has.
  //
  // The general rule this is one instance of: while data-oc-offer is set, the
  // page belongs to the question. Nothing may navigate until it is answered.
  if (Auth.init() && document.documentElement.getAttribute('data-oc-offer') !== '1') {
    // Already authenticated — skip to picker
    window.location.href = 'picker.html';
  }
</script>
</body>
</html>

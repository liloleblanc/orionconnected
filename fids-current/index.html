<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The one store for passenger words (board-strings.js): the phone offer
       below reads it. docs/BOARD-LANGUAGES.md. -->
  <script src="js/board-strings.js?v=24147"></script>
  <!-- v23803 — orionconnected.app IS THE APP.
       This page is the opener: it paints, then replaces itself with a board.
       On the .app domain it should hand over to the Airport Companion instead.
       Done here rather than in the Worker because static assets are served
       BEFORE the Worker runs — no run_worker_first — so the Worker never sees
       a request for "/" at all and cannot route on the Host header.

       First in the head, ahead of even the theme resolve: on .app the theme
       belongs to the page we are leaving, and reading it first only delays the
       handover by a frame. -->
  <script>
  (function () {
    try {
      var h = String(location.hostname || "").toLowerCase();
      // v23808 — .app MEANS THE APP ALL THE WAY DOWN, not just at the root.
      // It was the apex and www only, which made the domain mean the app at one
      // level and the board at every other. A domain that changes its mind a
      // level down is not a shortcut, it is a trap — and the per-airport form is
      // the one worth handing out: yqm.orionconnected.app is what goes on a
      // poster or a QR code at a gate. The board keeps yqm.orionconnected.com.
      if (h === "orionconnected.app" || /\.orionconnected\.app$/.test(h)) {
        // replace(), not assign(): the opener must not sit in history, or Back
        // from the app lands on a page whose only job is to leave again.
        location.replace("/app" + location.search + location.hash);
      }
    } catch (e) {}
  })();
  </script>

  <!-- v23161 — BOOT THEME RESOLVES BEFORE FIRST PAINT. Same treatment as
       fids/gids/bids. This page was missed in v23159, and it is the page a
       display actually OPENS on: index.html paints, then location.replace()s to
       fids.html. Without this it painted white first, so every open began with
       a white frame before the board's own boot even started — one of the
 flashes that get counted when a screen comes on. -->
  <script>
  (function () {
    try {
      var t = localStorage.getItem('fids_console_theme');
      if (t !== 'light' && t !== 'dark') {
        var h = new Date().getHours();
        t = (h >= 6 && h < 19) ? 'light' : 'dark';
      }
      var r = document.documentElement;
      /* v23163 — A SCREEN WITH NO MEMORY MUST NOT GUESS WHITE. The theme above
         is the CONSOLE preference, and with nothing saved it falls back to the
         hour: light between 06:00 and 19:00. The board it is about to cover is
         rgb(13,77,139) at every hour of the day, so on a display booting cold
         in daylight that guess put a full white screen up for the ten seconds
         the board takes to fill, then cut to blue. Measured on production:
         brightness 201 held from 3.7s to 14.0s.
         The board's ground is knowable, so it is the fallback now rather than
         the clock. fids_boot_ground still overrides it the moment a real board
         has reported its own colour, which is what makes this correct for a
         light board too. */
      var _learned = null;
      try {
        var _g = localStorage.getItem('fids_boot_ground');
        if (_g && /\d+\s*,\s*\d+\s*,\s*\d+/.test(_g)) _learned = _g;
      } catch (e) {}
      if (!_learned) t = 'dark';
      r.setAttribute('data-theme', t);
      r.style.background = _learned || 'rgb(13,77,139)';
      /* If a board has already recorded its own ground, this entry page paints
         straight into it, so the hand-off to fids.html has no colour change at
         all. */
      var g = localStorage.getItem('fids_boot_ground');
      if (g && /\d+\s*,\s*\d+\s*,\s*\d+/.test(g)) r.style.background = g;
    } catch (e) {}
  })();
  </script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIDS — Airport Display System v8</title>
  <!-- Auto-router for fids.orionconnected.com (runs in <head> before paint so
       the entry screen never flashes):
         • phones / tablets  → ASK, then the app on .app, or stay on the board
         • desktop / displays → /fids?mode=live  (LIVE main FIDS board)
       Escape hatches: ?entry=1 keeps the DEMO/LOGIN entry screen (admin),
       ?nomobile=1 forces the desktop board on a phone.

       v23808 — THE MOBILE BRANCH ASKS NOW INSTEAD OF DECIDING.
       It used to location.replace() a phone straight to app.html, silently, on
       whatever domain it arrived on. Two things were wrong with that.

       The redirect was a hijack. Board links get shared deliberately — someone
       on a phone checking a departure board, or looking at a screen they are
       about to point a TV at, was taken somewhere else with no way back except
       a query string they would have to know about.

       And the test below is wider than "a phone": `w < 700` catches a desktop
       browser in a narrow window, which is a real way to end up in the
       passenger app while sitting at a keyboard. That was invisible because
       there was nothing to notice — the entry screen never painted.

       So it offers, and the offer remembers. Answer once and you are never
       asked again on that domain; ?nomobile=1 still forces the board without
       asking at all, for anything scripted.

       The app lives on .app, so YES leaves this origin. That means the two
       domains remember separately — a preference is per-origin and cannot be
       read across — which is the right shape anyway: the answer to "do you want
       the app" is only meaningful on the domain that is not the app. -->
  <script>
    (function(){
      try{
        var qs = location.search || '';
        if (/[?&]entry=1/.test(qs)) return;           // admin: keep the entry/login screen

        /* v23812 — NEVER ASK ON THE .app ZONE. That domain IS the app, and the
           handover at the top of this head has already decided; the question
           does not apply there.

           Left unguarded it ran anyway, and the answers were worse than the
           question. "Stay on the regular site" sent a phone to
           fids.html?mode=live ON orionconnected.app — the full board, on the
           app's own domain, which is what "it sticks with the full site"
           turned out to be. And "use the mobile app" resolved to
           https://orionconnected.app/ with the same query string the page was
           already showing: a replace() onto itself.

           It was invisible from the .com side because the offer worked
           perfectly there. The damage happened one hop later, on the domain
           the answer sent you to, where a second copy of the same question had
           no idea it had already been answered. */
        if (/(^|\.)orionconnected\.app$/.test(String(location.hostname || '').toLowerCase())) return;
        /* v24145 — EVERY ADDRESS THIS PAGE SENDS ANYONE TO IS BUILT, NEVER
           PASSED ALONG. The query and the hash of this page are text a link
           can carry anything in, so no part of them is ever the start of an
           address. Each destination is a URL object made from a fixed path
           (or, for the app, a fixed host), the query and the hash are set
           on that object, and it is used only if its origin is this origin
           (the board) or an orionconnected.app address made here (the app). */
        var P = new URLSearchParams(qs);
        var here = String(location.origin || '');
        var hash = location.hash || '';

        /* THE AIRPORT. A code is three or four letters or digits, rebuilt
           letter by letter from this alphabet, so no character of the address
           bar reaches a host name. MET is the code passengers read for
           Saint-Hubert and YHU its real one; the labels listed are sites of
           ours, never airports. Both are the tables of host-airport.js, kept
           here because this page does not load that file (it would be a
           blocking request in the head of the one page whose whole job is to
           paint the right colour and leave); tests/mobile-offer.test.js holds
           the two copies together, label by label. */
        var ALPHA = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        var REAL = { MET: 'YHU' };
        var SITES = /^(fids|www|api|app|apps|menu|tour|mail|smtp|imap|pop|ftp|cdn|img|dev|test|beta|demo|edge|vpn|git|docs|blog|shop)$/;
        function codeOf(v) {
          var t = String(v == null ? '' : v).trim().toUpperCase(), out = '';
          if (t.length < 3 || t.length > 4) return '';
          for (var i = 0; i < t.length; i++) {
            var at = ALPHA.indexOf(t.charAt(i));
            if (at < 0) return '';
            out += ALPHA.charAt(at);
          }
          if (SITES.test(out.toLowerCase())) return '';
          return Object.prototype.hasOwnProperty.call(REAL, out) ? REAL[out] : out;
        }
        var host = String(location.hostname || '').toLowerCase();
        var ours = /(^|\.)orionconnected\.(com|ca)$/.test(host);
        var labels = host.split('.');
        // yqm.orionconnected.com is Moncton; fids., www., the apex and a
        // preview or local host name no airport.
        var hostAp = ours && labels.length === 3 ? codeOf(labels[0]) : '';
        var askedAp = codeOf(P.get('ap'));
        var tabAp = '';
        try { tabAp = codeOf(sessionStorage.getItem('fids_airport')); } catch (e) {}

        /* v24139 — THE PAGE THE PHONE CAME FOR. A board sends a phone that
           has not answered here with ?next= set to the board link it opened
           (a gate, a belt, an airport), so either answer lands there and not
           on the default board. Only a board page on this origin is taken:
           /fids, /gids or /bids with its query. Anything else is ignored, so
           the parameter can never send anyone off the site.
           v24145 — and it is taken apart, not passed along: the page picks
           one of three fixed paths, and its query is set on the URL object. */
        var PATHS = { fids: '/fids', gids: '/gids', bids: '/bids' };
        var nextM = /^\/(fids|gids|bids)(?:\.html)?(?:\?([^#\s\\]*))?$/.exec(P.get('next') || '');
        var path = nextM ? PATHS[nextM[1]] : PATHS.fids;
        var nextQ = nextM ? (nextM[2] || '') : '';
        var N = new URLSearchParams(nextQ);

        /* ONE AIRPORT FOR BOTH ANSWERS. The link the phone opened, then this
           address, then the airport the board itself falls back to (this tab,
           else YQM): the same order host-airport.js uses for a board with no
           ?ap=. So on fids. with no airport named, Stay and the app both go
           to that one airport, and neither goes to an address with none. */
        var ap = (nextM && codeOf(N.get('ap'))) || askedAp || hostAp || tabAp || 'YQM';

        /** The board link on this origin, or null if it would leave it. */
        function boardUrl(query, noMobile) {
          var u = new URL(path, location.href);
          var q = String(query || '');
          if (noMobile && !/(^|&)nomobile=1(&|$)/.test(q)) q += (q ? '&' : '') + 'nomobile=1';
          u.search = q;
          u.hash = hash;
          return u.origin === here ? u : null;
        }
        function go(u) { if (u) location.replace(u.href); }

        var ua = navigator.userAgent || '';
        /* v23824 — A TELEVISION IS NOT A PHONE, AND A NARROW WINDOW IS NOT EITHER.
           This read /Mobi|Android|…/ plus w < 700, and both halves are wrong for
           a display:

             · bare "Android" matches EVERY Android TV and Fire TV stick. They
               all carry it in the user agent.
             · a display can be narrower than 700px. A window can be too.

           Before the offer existed those devices were silently redirected to
           app.html — wrong, but they showed something. Once the page HOLDS for
           an answer, a misdetected display stops on a question that cannot be
           answered with a TV remote, and the board never arrives.

           fids-core.js already got this right, and its comment says so: bare
           Android without Mobile is not a phone, and it runs no width test at
           all. This is that same test, so the two agree. */
        var isMobile = /iPhone|iPod|iPad|Windows Phone/i.test(ua)
                    || (/Android/i.test(ua) && /Mobile/i.test(ua));

        // Desktop/displays → LIVE main board. Don't force an airport: carry a
        // root ?ap= if present, otherwise let the board use its own
        // saved/selected airport (works for ALL airports, not locked to YQM).
        // v24145 — /fids, not fids.html: the host answers .html with a
        // redirect of its own, one hop more on the way to the airport address.
        if (!isMobile) { go(boardUrl(nextM ? nextQ : 'mode=live' + (askedAp ? '&ap=' + askedAp : ''), false)); return; }

        /* Everything past here is a phone — and THE BOARD HANDS PHONES OFF
           TOO. A board page (fids/gids/bids) asks a phone that arrives fresh,
           by sending it back here. So "go to the board" from here is not
           enough on its own: the answer has to travel with the link, and
           nomobile=1 is that answer (only that exact pair, here, in the head
           of each board and in host-airport.js). The Stay link names the
           airport wherever this address does not, so it cannot land on a
           different airport than the app answer. */
        var stay = boardUrl(nextM ? nextQ : 'mode=live' + (askedAp || !hostAp ? '&ap=' + ap : ''), true);

        if (/[?&]nomobile=1(&|$)/.test(qs)) {
          try { sessionStorage.setItem('oc_board_tab', '1'); } catch (e) {}
          go(stay); return;
        }

        /* v24145 — THE APP IS ON .app. "Use the mobile app" goes to
           https://<code>.orionconnected.app/app, the address that is only the
           app, with the airport, screen, gate and belt of the link. The host
           is made of the three letters of the airport and fixed text; a
           four-letter code (ICAO) names no address, so it rides to the apex
           as ?ap= and the app resolves it. A preview or local host has no
           .app, so there it stays /app on its own origin. */
        var app = new URL(ours ? 'https://' + (ap.length === 3 ? ap.toLowerCase() + '.' : '') + 'orionconnected.app/app' : '/app', location.href);
        app.searchParams.set('ap', ap);
        // The app reads the same ?screen= / ?gate= / ?belt= the board link
        // carried, and nothing else of it. A registry id is no app screen.
        ['screen', 'gate', 'belt'].forEach(function (k) {
          var v = N.get(k);
          if (v === null || v === '') return;
          if (k === 'screen' && /^[A-HJ-NP-Z2-9]{6}$/.test(v)) return;
          app.searchParams.set(k, v);
        });
        if (!app.searchParams.has('screen') && path === PATHS.gids) app.searchParams.set('screen', 'gate');
        if (!app.searchParams.has('screen') && path === PATHS.bids) app.searchParams.set('screen', 'baggage');
        app.hash = hash;
        var appOk = ours ? /^https:\/\/([a-z0-9]{3}\.)?orionconnected\.app$/.test(app.origin) : app.origin === here;

        /* v24145 — ASKED EVERY TIME. A phone that arrives at a board link is
           asked board or app on every arrival; the answer is no longer kept
           (oc_mobile_pref is cleared, and ?mobile=ask is harmless). Inside a
           board the tab remembers that a board was shown (oc_board_tab,
           sessionStorage: this tab, this origin), so the board never asks
           again on a row, a gate or the menu. */
        try { localStorage.removeItem('oc_mobile_pref'); } catch (e) {}

        // Hold the page and let the offer paint over the ground of the board,
        // which the theme script above has already put up, so this reads as
        // the page arriving, not as a flash then a dialog.
        window.__ocOffer = { ap: ap, app: appOk ? app.href : '', board: stay ? stay.href : '' };
        document.documentElement.setAttribute('data-oc-offer', '1');
      }catch(e){}
    })();
  </script>
  <style>
    /* The entry screen is the admin DEMO/LOGIN page. While the offer is up it
       must not be behind it — [hidden] is not used because the entry screen's
       own stylesheet sets display on these elements. */
    html[data-oc-offer="1"] body > *:not(#ocOffer) { display: none !important; }
    #ocOffer { display: none; }
    html[data-oc-offer="1"] #ocOffer {
      display: flex; position: fixed; inset: 0; z-index: 2147483647;
      flex-direction: column; align-items: center; justify-content: center;
      gap: clamp(18px, 5vw, 28px); padding: clamp(22px, 7vw, 40px);
      background: rgb(13,77,139); color: #fff;
      font-family: 'Bricolage Grotesque', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center; -webkit-font-smoothing: antialiased;
    }
    #ocOffer .ocq { font-size: clamp(19px, 5.4vw, 26px); font-weight: 700; line-height: 1.3; max-width: 22ch; }
    /* Every bilingual pair is two LINES. Inline, the two languages run into each
       other — "Use the mobile appUtiliser l’application mobile" — which reads as
       one broken string rather than the same thing said twice. The buttons need
       this as much as the heading; it was the heading only, and the buttons are
       where it showed. */
    #ocOffer .ocq span, #ocOffer button span { display: block; }
    #ocOffer .ocq span + span,
    #ocOffer button span + span { margin-top: .32em; font-weight: 400; opacity: .78; font-size: .84em; }
    #ocOffer .ocbtns { display: flex; flex-direction: column; gap: clamp(10px, 2.6vw, 14px); width: min(340px, 100%); }
    #ocOffer button {

    }
    #ocOffer .ocyes { background: #fff; color: rgb(13,77,139); }
    #ocOffer .ocno  { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); font-weight: 400; }
    #ocOffer button:focus-visible { outline: 3px solid #ffd54a; outline-offset: 3px; }
  </style>

<body>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     v23808 — THE MOBILE OFFER. Only ever painted when the head script above
     decided this is a phone AND nobody has answered on this domain before.

     The airport's two languages, always, from the store (board-strings.js).
     French first at the Québec airports, which is the standing rule for
     anything a passenger reads. This is the only passenger-facing prompt on
     the opener, so it is the one place that rule could go unnoticed.
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="ocOffer" role="dialog" aria-modal="true" aria-labelledby="ocOfferQ">
  <div class="ocq" id="ocOfferQ"></div>
  <div class="ocbtns">
    <button type="button" class="ocyes" id="ocOfferYes"></button>
    <button type="button" class="ocno"  id="ocOfferNo"></button>
  </div>
</div>
<script>
(function () {
  try {
    if (document.documentElement.getAttribute('data-oc-offer') !== '1') return;
    var o = window.__ocOffer || {};

    // v23970 — the airport's own pair of languages, through the one store:
    // French first at the Québec airports (BoardStrings.FR_FIRST — this page
    // kept its own list of four), Spanish where the airport speaks it, and
    // every word in all nine languages. The rule is about the airport, not
    // the language of the device — a phone set to English standing in
    // Montréal still reads French first.
    var ap = String(o.ap || '').toUpperCase();
    var L = BoardStrings.pairLangs(BoardStrings.resolveLangs({ iata: ap }).langs, ap);

    function two(k) {
      return BoardStrings.pair(k, { langs: L, iata: ap, sep: '' });
    }
    document.getElementById('ocOfferQ').innerHTML = two('mobileAsk');
    document.getElementById('ocOfferYes').innerHTML = two('mobileYes');
    document.getElementById('ocOfferNo').innerHTML = two('mobileNo');
    // v24145 — no note: the answer is not remembered past this arrival, so
    // there is nothing to take back with ?mobile=ask.

    function answer(pref, to) {
      // v24145 — the last check before leaving: the answer is read as a URL
      // and used only if it is this origin (the board, and the app on a
      // preview or local host) or an orionconnected.app address (the app).
      // Anything else lands on the board this address is for.
      var u = null;
      try { u = to ? new URL(to, location.href) : null; } catch (e) { u = null; }
      var ok = !!u && (u.origin === location.origin
        || (pref === 'app' && /^https:\/\/([a-z0-9]{3}\.)?orionconnected\.app$/.test(u.origin)));
      if (!ok) { pref = 'site'; u = new URL('/fids?mode=live&nomobile=1', location.href); }
      // The board answer marks this tab, on this origin, as inside a board,
      // so the board does not ask again; the app answer leaves for .app.
      if (pref === 'site') { try { sessionStorage.setItem('oc_board_tab', '1'); } catch (e) {} }
      // replace(), not assign(): the offer must not sit in history, or Back
      // from either destination lands on a question already answered.
      location.replace(u.href);
    }
    document.getElementById('ocOfferYes').addEventListener('click', function () { answer('app', o.app); });
    document.getElementById('ocOfferNo').addEventListener('click', function () { answer('site', o.board); });
    document.getElementById('ocOfferYes').focus();
  } catch (e) {
    // If anything here fails the question can never be answered, so fall back
    // to the destination that loses nothing: the board this domain is for.
    try {
      document.documentElement.removeAttribute('data-oc-offer');
      var back = new URL((window.__ocOffer || {}).board || '/fids?mode=live', location.href);
      if (back.origin !== location.origin) back = new URL('/fids?mode=live', location.href);
      location.replace(back.href);
    } catch (e2) {}
  }
})();
</script>

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     ENTRY SCREEN — Two buttons: DEMO and LOGIN
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<div id="entryScreen" class="entry-screen" data-operator>
  <div class="ocb">
    <!-- Brand rail — same design language as the F.I.D.S./G.A.T.E./B.A.G.S. boot loaders -->
    <div class="ocb-rail">
      <div class="ocb-brand">
        <img class="ocb-logo" src="/logos/brand/orion-connected-on-dark.svg" alt="Orion Connected">
        <div class="ocb-lockup">Connecting Beyond</div>
      </div>
      <div class="ocb-id">
        <div class="ocb-code">FIDS</div>
        <div class="ocb-name">Airport Display System</div>
      </div>
      <div class="ocb-boot"><span class="ocb-dot"></span>SECURE ENTRY</div>
    </div>

    <!-- Stage: rotating greeting + actions -->
    <div class="ocb-stage">
      <div class="ocb-hero" id="ocbHero">Welcome</div>
      <div class="ocb-sub">Administrator &amp; display entry · Entrée administrateur et affichage</div>
      <div class="ocb-actions">
        <button class="ocb-btn ocb-btn-primary" onclick="showLogin()">LOGIN</button>
        <button class="ocb-btn ocb-btn-ghost" onclick="enterDemo()">DEMO</button>
      </div>
      <div class="ocb-langs" id="ocbLangs"></div>
      <div class="ocb-version">v8 · ORION CONNECTED</div>
    </div>
  </div>

  <style>
    #entryScreen{ position:fixed; inset:0; z-index:100; display:block; padding:0;
      background:#fbfcfe; transition:opacity .4s ease; }
    #entryScreen .ocb{ position:absolute; inset:0; display:flex; }
    #entryScreen .ocb-rail{
      flex:0 0 clamp(240px,20vw,340px); box-sizing:border-box;
      background:linear-gradient(165deg,#313130 0%,#1c1c1b 100%);
      display:flex; flex-direction:column; justify-content:center;
      gap:clamp(24px,3.4vh,44px); padding:clamp(30px,4vh,56px) clamp(26px,2.2vw,40px);
    }
    #entryScreen .ocb-brand{ display:flex; flex-direction:column; gap:14px; align-items:flex-start; }
    /* v24042 — THE LOGO IN COLOUR, AND THE WIDTH OF THE RAIL. This was the
       charcoal mark (orion-connected-white.svg carries charcoal ink, whatever
       its name says) forced flat white by a filter, inside a square 1024 box
       that is mostly empty, so the artwork drew about 90px wide in a 262px
       rail. orion-connected-on-dark.svg is the official colour logo for a
       dark ground: white lettering, the gold planets and stars as drawn, no
       backing shape, cropped to the artwork, so the rail's width is the
       logo's width. No filter: one would turn the gold white. */
    #entryScreen .ocb-logo{ display:block; width:100%; height:auto; aspect-ratio:3975/2410; object-fit:contain; filter:none; }
    #entryScreen .ocb-lockup{ font-family:'AC Nord Text','AC Nord Display',system-ui,sans-serif;
      font-size:clamp(13px,1.15vw,19px); font-weight:600; letter-spacing:.01em; color:rgba(255,255,255,.62); }
    #entryScreen .ocb-code{ font-family:'AC Nord Display','AC Nord Text',system-ui,sans-serif;
      font-size:clamp(34px,3.1vw,58px); font-weight:800; letter-spacing:.01em; color:#fff; line-height:1; }
    #entryScreen .ocb-name{ margin-top:10px; font-family:'AC Nord Text',system-ui,sans-serif;
      font-size:clamp(11px,.92vw,16px); font-weight:400; line-height:1.4; color:rgba(255,255,255,.55); max-width:15em; }
    #entryScreen .ocb-boot{ display:flex; align-items:center; gap:8px; font-family:'AC Nord Text',system-ui,sans-serif;
      font-size:clamp(9px,.75vw,13px); font-weight:700; letter-spacing:.22em; color:rgba(255,255,255,.5); }
    #entryScreen .ocb-dot{ width:7px; height:7px; border-radius:50%; background:#eab308;
      box-shadow:0 0 10px rgba(234,179,8,.7); animation:fids-loader-pulse 2s ease-in-out infinite; }
    #entryScreen .ocb-stage{
      flex:1 1 auto; display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
      padding:0 clamp(40px,4.2vw,88px);
      background:linear-gradient(180deg,#fbfcfe 0%,#eef2f8 100%); color:#0f172a;
    }
    #entryScreen .ocb-hero{ font-family:'AC Nord Display','AC Nord Text',system-ui,sans-serif;
      font-size:clamp(40px,5vw,92px); font-weight:800; letter-spacing:-.03em; line-height:1; color:#0f172a;
      transition:opacity .5s ease, transform .5s ease; }
    #entryScreen .ocb-hero.is-swap{ opacity:0; transform:translateY(10px); }
    #entryScreen .ocb-sub{ margin-top:clamp(14px,1.8vh,22px); font-family:'AC Nord Text',system-ui,sans-serif;
      font-size:clamp(12px,1vw,17px); color:#475569; }
    #entryScreen .ocb-actions{ margin-top:clamp(26px,3.4vh,44px); display:flex; gap:14px; }
    #entryScreen .ocb-btn{ font-family:'AC Nord Display','AC Nord Text',system-ui,sans-serif;
      font-size:clamp(13px,1vw,17px); font-weight:800; letter-spacing:.12em;
      padding:clamp(12px,1.4vh,16px) clamp(26px,2.4vw,42px); border-radius:10px; cursor:pointer;
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease; }
    #entryScreen .ocb-btn:hover{ transform:translateY(-1px); }
    #entryScreen .ocb-btn-primary{ background:#d97706; border:1px solid #d97706; color:#fff;
      box-shadow:0 6px 18px rgba(217,119,6,.28); }
    #entryScreen .ocb-btn-primary:hover{ background:#c26a05; }
    #entryScreen .ocb-btn-ghost{ background:transparent; border:1px solid rgba(15,23,42,.22); color:#0f172a; }
    #entryScreen .ocb-btn-ghost:hover{ border-color:rgba(15,23,42,.45); }
    #entryScreen .ocb-langs{ margin-top:clamp(22px,3vh,36px); display:flex; align-items:center; gap:clamp(10px,1vw,16px); }
    #entryScreen .ocb-lang{ font-family:'AC Nord Text',system-ui,sans-serif; font-size:clamp(10px,.85vw,14px);
      letter-spacing:.1em; font-weight:500; color:#94a3b8; transition:color .3s, font-weight .3s; }
    #entryScreen .ocb-lang.is-on{ color:#d97706; font-weight:700; }
    #entryScreen .ocb-version{ margin-top:clamp(26px,3.6vh,46px); font-family:'AC Nord Text',system-ui,sans-serif;
      font-size:11px; letter-spacing:.22em; font-weight:700; color:#94a3b8; }
    @media (max-aspect-ratio:1/1){
      /* v24042 — stacked on a small phone the rail and the stage are
         taller than the screen; scroll, as the picker does, so the
         language row and the version line are never cut off. */
      #entryScreen .ocb{ flex-direction:column; overflow-y:auto; }
      #entryScreen .ocb-rail{ flex-basis:auto; }
      /* v24042 — stacked, the rail is the screen's whole width, so a
         1080px portrait display would draw the logo over 1000px wide.
         At most 360px, which fills the rail of a 390px phone, and at
         most 40% of the screen's height, so a short phone keeps the
         rest of the screen in view. */
      #entryScreen .ocb-logo{ width:min(100%,360px,40vh); }
      #entryScreen .ocb-stage{ align-items:center; text-align:center; padding-top:clamp(24px,4vh,48px); }
      #entryScreen .ocb-actions{ justify-content:center; }
    }
  </style>

  <script>
  (function(){
    var root = document.currentScript.closest('#entryScreen');
    if(!root || root._ocbInit) return; root._ocbInit = true;
    var GREET = [["EN","Welcome"],["FR","Bienvenue"],["ES","Bienvenido"],["DE","Willkommen"],["PT","Bem-vindo"],["中文","欢迎"]]; // i18n-ok: operator
    var heroEl = root.querySelector('#ocbHero');
    var langsEl = root.querySelector('#ocbLangs');
    GREET.forEach(function(g){ var s=document.createElement('span'); s.className='ocb-lang'; s.textContent=g[0]; langsEl.appendChild(s); });
    var chips = langsEl.children;
    heroEl.textContent = GREET[0][1]; chips[0].classList.add('is-on');
    var i = 0;
    setInterval(function(){
      i=(i+1)%GREET.length;
      heroEl.classList.add('is-swap');
      setTimeout(function(){
        heroEl.textContent = GREET[i][1];
        for(var k=0;k<chips.length;k++) chips[k].classList.toggle('is-on', k===i);
        heroEl.classList.remove('is-swap');
      }, 260);
    }, 2800);
  })();
  </script>
</div>

<div id="loginOverlay" class="login-overlay" data-operator>

    <div class="ocb-field">

    <div class="ocb-login-actions">

    #loginOverlay .ocb-login-sub{ margin-top:6px; font-size:13px; color:#94a3b8; margin-bottom:26px; }
    #loginOverlay .ocb-field{ margin-bottom:18px; }
    #loginOverlay .ocb-field label{ display:block; font-size:10px; letter-spacing:.18em; font-weight:700; color:#475569; margin-bottom:7px; }
    #loginOverlay .ocb-field input{
      width:100%; box-sizing:border-box; padding:13px 14px; border-radius:10px;

    #loginOverlay .ocb-field input:focus{ border-color:#d97706; box-shadow:0 0 0 3px rgba(217,119,6,.18); }

    #loginOverlay .ocb-btn{ font-family:'AC Nord Display','AC Nord Text',system-ui,sans-serif; font-size:14px;

<!-- ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
     SCRIPTS
     ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ -->
<script src="js/auth.js?v=23170"></script>
<script>
  // ── Entry Actions ─────────────────────────────────────────────────────

  function enterDemo() {
    // No auth needed — go straight to picker in demo mode
    sessionStorage.setItem('fids_mode', 'demo');
    window.location.href = 'picker.html';
  }

  function showLogin() {
    document.getElementById('loginOverlay').classList.add('open');
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    setTimeout(() => document.getElementById('loginUser').focus(), 200);
  }

  function hideLogin() {
    document.getElementById('loginOverlay').classList.remove('open');
  }

  async function attemptLogin() {
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    const errEl = document.getElementById('loginError');

    if (!user || !pass) {
      errEl.textContent = 'Please enter username and password';
      errEl.classList.add('show');
      return;
    }

    // Show loading state
    const submitBtn = document.querySelector('.login-btn-submit');
    const originalText = submitBtn.textContent;
    submitBtn.textContent = '...';
    submitBtn.disabled = true;

    const result = await Auth.login(user, pass);

    submitBtn.textContent = originalText;
    submitBtn.disabled = false;

    if (result.success) {
      sessionStorage.setItem('fids_mode', 'live');
      // Fade out and navigate
      document.getElementById('loginOverlay').classList.remove('open');
      document.getElementById('entryScreen').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'picker.html';
      }, 400);
    } else {
      errEl.textContent = result.error || 'Invalid credentials / Identifiants invalides';
      errEl.classList.add('show');
      document.getElementById('loginPass').value = '';
      document.getElementById('loginPass').focus();
    }
  }

  // ── Keyboard ──────────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const overlay = document.getElementById('loginOverlay');
      if (overlay.classList.contains('open')) hideLogin();
    }
  });

  // ── Check for existing session ────────────────────────────────────────
  // v23811 — NOT WHILE A QUESTION IS OPEN.
  //
  // This jump is older than the mobile offer and never used to collide with
  // anything: the head redirected a phone to the app BEFORE the body ran, so
  // on a phone this line was unreachable. The offer holds the page instead of
  // leaving it, and the moment it does, a signed-in session lands here and
  // navigates away out from under the question — the offer paints, then the
  // picker replaces it, with no way to answer.
  //
  // Only phones are affected, because only phones are asked. A desktop never
  // raises the offer, so the attribute is absent and this behaves exactly as
  // it always has.
  //
  // The general rule this is one instance of: while data-oc-offer is set, the
  // page belongs to the question. Nothing may navigate until it is answered.
  if (Auth.init() && document.documentElement.getAttribute('data-oc-offer') !== '1') {
    // Already authenticated — skip to picker
    window.location.href = 'picker.html';
  }
</script>
</body>
</html>

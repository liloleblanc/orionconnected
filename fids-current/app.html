<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<!-- v23808 — yqm.orionconnected.app OPENS MONCTON'S APP.
     The boards have read their airport from the hostname since v23803; the app
     never has, so a per-airport .app link would have opened on whatever airport
     this device happened to look at last. It only needed the file: the app
     already resolves ?ap= → sessionStorage.fids_airport → default, and
     fids_airport is exactly the key host-airport.js writes.

     Loaded rather than re-parsed. The hostname parse has one home on purpose —
     the studio's own copy of it read fids.orionconnected.com as an airport
     called FIDS, which is the failure this file exists to prevent. It must come
     before the app resolves its airport, hence the head. -->
<script src="js/host-airport.js?v=24055"></script>
<title>Airport Companion</title>
<style>
  /* v24030 — the boards' own face, Bricolage Grotesque (SIL OFL), from this
     site's own files (the boards' font.css faces), not Inter from Google */
  @font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;font-style:normal;font-display:swap;src:url('fonts/bricolage/BricolageGrotesque-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
  @font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;font-style:normal;font-display:swap;src:url('fonts/bricolage/BricolageGrotesque-latin-ext.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;}
  /* v24043 — an airport whose boards are set in Possibility (Moncton: its
     airport config says font:"possibility") is set in it here too, as the
     board's font.css does: the same licensed webfont, which the Worker
     serves at this path on .com, .ca and .app (never in the repository), one
     bold weight for every weight asked, Bricolage behind it for what it does
     not cover. Loaded only when an airport asks for it (--app-font). */
  @font-face{font-family:'Possibility';font-weight:100 900;font-style:normal;font-display:swap;src:url('fonts/Possibility-Bold-Web.woff2') format('woff2');}
  /* v24043 — THE BOARD IN YOUR POCKET.
     The app takes the phone board's own frame (css/phone.css, v24029): the
     airport's logo and clock on the page's surface, then the board's navy band
     with Departures and Arrivals in white. The list is the board's row, not a
     poster per flight: the time first, the airline's own tile and wordmark,
     the place, the status on a solid pill, and the gate in its own box. Night
     is the boards' navy, not grey. Every colour pair on a row is a pair from
     this sheet, so no airline's colour can sit under its own status again
     (Flair's green bubble put a green "On time" on it at 1.07:1). */
  :root{
    color-scheme:light;
    --bg:#eef2f7; --card:#ffffff; --soft:#f4f7fb;
    --line:rgba(11,31,58,.09); --line2:rgba(11,31,58,.16);
    --txt:#0b1f3a; --muted:#53627a; --faint:#8995a8;
    --head:#ffffff; --head-ink:#0b1f3a; --head-muted:#53627a;
    --band:#0b1f3a;
    --slot:#eaf0f8; --slot-ink:#0b1f3a;
    --accent:#1f6fe0;
    --green:#16a34a; --amber:#d97706; --red:#dc2626;
    --ok-bg:#dcf2e4; --ok-ink:#11663a; --late-bg:#fdedcc; --late-ink:#8a4300;
    --cx-bg:#fde2e2; --cx-ink:#a3101c; --brd-bg:#dce8fb; --brd-ink:#0d4aa8; --neu-bg:#e9eef5;
    --moved:#b45309; --cx:#c8102e;
    --radius:14px;
    --shadow:0 1px 2px rgba(11,31,58,.05);
    --hdr-h:112px;
    --app-font:'Bricolage Grotesque',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  /* ── Night: the boards' navy (forced, or auto via system) ───── */
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#06101f; --card:#0c1c36; --soft:#10223f;
    --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
    --txt:#eef3fb; --muted:#9aaccc; --faint:#64789a;
    --head:#081a33; --head-ink:#ffffff; --head-muted:#9aaccc;
    --band:#0f2a52;
    --slot:rgba(255,255,255,.07); --slot-ink:#ffffff;
    --accent:#5b8dff; --green:#37c98b; --amber:#e0a23c; --red:#e8584f;
    --ok-bg:rgba(55,201,139,.16); --ok-ink:#7ee2b0; --late-bg:rgba(245,166,35,.18); --late-ink:#ffd27a;
    --cx-bg:rgba(239,68,68,.24); --cx-ink:#ffc9c9; --brd-bg:rgba(96,148,255,.22); --brd-ink:#c9dcff; --neu-bg:rgba(255,255,255,.08);
    --moved:#fbbf24; --cx:#b3132a;
    --shadow:none;
  }
  @media (prefers-color-scheme: dark){
    :root[data-theme="auto"]{
      color-scheme:dark;
      --bg:#06101f; --card:#0c1c36; --soft:#10223f;
      --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
      --txt:#eef3fb; --muted:#9aaccc; --faint:#64789a;
      --head:#081a33; --head-ink:#ffffff; --head-muted:#9aaccc;
      --band:#0f2a52;
      --slot:rgba(255,255,255,.07); --slot-ink:#ffffff;
      --accent:#5b8dff; --green:#37c98b; --amber:#e0a23c; --red:#e8584f;
      --ok-bg:rgba(55,201,139,.16); --ok-ink:#7ee2b0; --late-bg:rgba(245,166,35,.18); --late-ink:#ffd27a;
      --cx-bg:rgba(239,68,68,.24); --cx-ink:#ffc9c9; --brd-bg:rgba(96,148,255,.22); --brd-ink:#c9dcff; --neu-bg:rgba(255,255,255,.08);
      --moved:#fbbf24; --cx:#b3132a;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;overscroll-behavior-y:none;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:var(--app-font);
    -webkit-font-smoothing:antialiased; letter-spacing:0;
    min-height:100dvh;
    padding-bottom:calc(env(safe-area-inset-bottom) + 24px);
  }
  svg{display:block;}
  .ic{width:22px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible,.brand:has(select:focus-visible),.search input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ── The header: logo and clock, then the band ─────────────── */
  .topbar{position:sticky;top:0;z-index:20;background:var(--head);box-shadow:0 1px 0 var(--line);}
  .tb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:calc(env(safe-area-inset-top) + 9px) 16px 9px;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;position:relative;flex:1 1 auto;}
  /* the airport's own logo, on the page's own surface — no tile, no card;
     at night its lettering turns white (never a white box behind it) */
  .brand .logo{display:flex;align-items:center;flex:none;height:36px;max-width:40vw;
    font-weight:800;font-size:22px;letter-spacing:-.01em;color:var(--head-ink);}
  .brand .logo img{display:block;height:34px;width:auto;max-width:40vw;object-fit:contain;object-position:left center;}
  .brand .logo .lcode{display:none;}
  :root[data-theme="dark"] .brand .logo[data-night="white"] img{filter:brightness(0) invert(1);}
  :root[data-theme="dark"] .brand .logo[data-night="code"] img{display:none;}
  :root[data-theme="dark"] .brand .logo[data-night="code"] .lcode{display:inline;}
  @media(prefers-color-scheme:dark){
    :root[data-theme="auto"] .brand .logo[data-night="white"] img{filter:brightness(0) invert(1);}
    :root[data-theme="auto"] .brand .logo[data-night="code"] img{display:none;}
    :root[data-theme="auto"] .brand .logo[data-night="code"] .lcode{display:inline;}
  }
  [dir="rtl"] .brand .logo img{object-position:right center;}
  /* v24043 — the airport is named once, as the phone board names it: its logo,
     with a small chevron after it (the logo is the button that opens the
     picker). The header used to name it three times — the logo, the name,
     the code — and an unknown code read 'XYZ XYZ XYZ'. With no logo the code
     stands in the logo's place, and the name follows only where it is more
     than the code. */
  .brand{flex:0 1 auto;}
  .brand .apn{font-size:14.5px;font-weight:750;color:var(--head-ink);line-height:1.15;min-width:0;white-space:normal;overflow-wrap:normal;}
  .brand .apn:empty,.brand.has-logo .apn{display:none;}
  .brand .chev{width:15px;height:15px;stroke-width:2.4;flex:none;color:var(--head-muted);margin-inline-start:-4px;}
  .brand select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;}
  @media (max-width:360px){
    .brand .logo,.brand .logo img{max-width:44vw;}
  }
  .clock{flex:none;text-align:end;}
  .clock .t{font-size:21px;font-weight:800;letter-spacing:-.015em;line-height:1;color:var(--head-ink);white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
  .clock .t small{font-size:.52em;font-weight:800;margin-left:2px;}
  .clock .d{font-size:11px;font-weight:600;color:var(--head-muted);white-space:nowrap;margin-top:4px;}
  .band{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--band);}
  .seg{flex:1 1 auto;display:flex;gap:3px;padding:3px;border-radius:11px;background:rgba(255,255,255,.1);min-width:0;}
  /* the tab that is not chosen reads in full white: on Moncton's Acadian red
     band a softer white fell under 4.5:1 */
  .seg button{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 8px;
    border:0;border-radius:8px;background:none;color:#ffffff;font-size:14px;font-weight:750;line-height:1.05;white-space:normal;transition:background .15s,color .15s;}
  .seg button.active{background:#ffffff;color:#0b1f3a;box-shadow:0 1px 3px rgba(0,0,0,.25);}
  /* v24043 — the boards' own take-off and landing marks (logos/icons, v24039),
     drawn through a mask in the tab's own colour, as css/font.css draws
     .ac-ico-depart and .ac-ico-landing; the outline icons were generic */
  .tic{display:block;flex:none;width:19px;height:19px;background-color:currentColor;
    -webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;}
  .tic.dep{-webkit-mask-image:url('logos/icons/takeoff.svg');mask-image:url('logos/icons/takeoff.svg');}
  .tic.arr{-webkit-mask-image:url('logos/icons/landing.svg');mask-image:url('logos/icons/landing.svg');}
  .tic.pln{-webkit-mask-image:url('logos/icons/plane.svg');mask-image:url('logos/icons/plane.svg');}
  [dir="rtl"] .tic.dep,[dir="rtl"] .tic.arr{transform:scaleX(-1);}
  /* a small phone: the word alone, with the room the icon took (English
     'Departures' ran 2 px past its white pill at 320 px) */
  @media (max-width:359.98px){
    .seg button{padding:0 4px;gap:0;}
    .seg button .tic{display:none;}
  }
  .tb-btn{position:relative;flex:none;width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.1);color:#ffffff;
    display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;letter-spacing:.05em;}
  .tb-btn .ic{width:19px;height:19px;}
  .tb-btn select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;}

  /* ── Search and the feed line ─────────────────────────────── */
  .search-wrap{padding:12px 12px 4px;}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;box-shadow:var(--shadow);}
  .search .ic{width:18px;height:18px;color:var(--faint);flex:none;}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--txt);font-family:inherit;font-size:16px;font-weight:550;}
  /* the whole hint fits the field on a narrow phone (never cut mid-phrase);
     the field itself stays at 16px so iOS does not zoom on focus */
  .search input::placeholder{color:var(--faint);font-weight:500;font-size:min(15px,3.55vw);}
  .hint{padding:8px 18px 6px;color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;line-height:1.3;}
  /* v23939 — the "Live departures" dot is solid, like the boards' LIVE dot. */
  .hint .live{width:7px;height:7px;border-radius:50%;background:var(--green);animation:none;flex:none;}
  /* v24043 — the dot is green only when the feed is live: grey while it loads
     or when there is no data, amber over an older list */
  .hint .live.wait,.hint .live.down{background:var(--faint);}
  .hint .live.stale{background:var(--amber);}
  .hint[hidden]{display:none;}
  /* an airport whose boards show no weather shows none here either */
  .no-wx .wx,.no-wx #wxCredit,.no-wx .dt-credit{display:none !important;}

  /* ── Views ───────────────────────────────────────── */
  .view{display:none;} .view.active{display:block;}
  /* ── Ad banner ───────────────────────────────────── */
  .ad-banner{margin:14px 18px 4px;border-radius:var(--radius);position:relative;overflow:hidden;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
    display:flex;align-items:center;gap:14px;padding:15px 16px;}
  /* Mobile app is ad-free — hide the sponsored banner strip (no empty gap). */
  #adBanner{display:none!important;}
  .ad-banner .tile{width:46px;height:46px;border-radius:13px;flex:none;background:var(--soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;}
  .ad-banner .t{font-size:15px;font-weight:700;}
  .ad-banner .s{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500;}
  .ad-banner .tag{position:absolute;top:9px;right:12px;font-size:8.5px;letter-spacing:.13em;color:var(--faint);text-transform:uppercase;font-weight:600;}

  /* ── The rows ────────────────────────────────────── */
  .cards{padding:4px 12px 8px;display:flex;flex-direction:column;gap:8px;}
  /* v24043 — the gate column is as wide as its word needs (CARROUSEL,
     ターンテーブル) and never narrower than 58 px; the word is the same on every
     row of a list, so every row's column is the same width. A value never
     widens it (contain: a long TBD wraps inside the box). */
  .fcard{display:grid;grid-template-columns:74px minmax(0,1fr) auto;grid-template-rows:auto auto auto;column-gap:10px;row-gap:0;
    align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 10px 9px 12px;box-shadow:var(--shadow);cursor:pointer;position:relative;
    content-visibility:auto;contain-intrinsic-size:auto 80px;}
  .fcard:active{transform:scale(.995);}
  .fcard .tcol{grid-column:1;grid-row:1 / 4;align-self:center;min-width:0;}
  .fcard .hh{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1;color:var(--txt);white-space:nowrap;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;}
  .fcard .hh small,.dt-cell .v small{font-size:.52em;font-weight:800;margin-left:2px;letter-spacing:0;}
  /* a moved time: the airport's new time is the big one, the printed one struck above it */
  .fcard .was{display:inline-block;position:relative;font-size:12.5px;font-weight:700;line-height:1;color:var(--muted);margin-bottom:4px;white-space:nowrap;direction:ltr;unicode-bidi:isolate;}
  .fcard .was small{font-size:.75em;margin-left:1px;}
  .fcard .hh.moved{color:var(--moved);}
  /* v24043 — ONE LINE THROUGH THE WHOLE TIME. text-decoration struck the
     digits and drew its line under the smaller AM, which read as a typo; the
     line is now drawn once, across the time and its AM/PM together. */
  /* its height: through the lower middle of the digits and the upper middle
     of the smaller AM, the one height that crosses both */
  .fcard .was::after,.fcard.cx .hh::after,.dt-cell .v.strike .ltr::after,.dt-cell .v.was .ltr::after{content:'';position:absolute;left:-1px;right:-1px;top:.68em;height:2px;margin-top:-1px;background:currentColor;pointer-events:none;}
  .fcard .was::after{height:1.5px;top:.6em;}
  .dt-cell .v.was .ltr::after{top:.6em;}
  .fcard .l1{grid-column:2 / 4;grid-row:1;display:flex;align-items:center;gap:7px;flex-wrap:wrap;row-gap:4px;min-width:0;min-height:22px;margin-bottom:3px;}
  .fcard .al{display:flex;align-items:center;gap:7px;min-width:0;}
  .tile{width:22px;height:22px;border-radius:6px;flex:none;object-fit:cover;display:block;}
  .tile.emb{object-fit:contain;border-radius:0;}
  .tile.mono{display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#ffffff;letter-spacing:.02em;}
  /* the airline's own wordmark: its colours by day, white lettering at night */
  .wm{display:block;flex:none;height:15px;}
  img.wm{width:auto;max-width:112px;object-fit:contain;object-position:left center;}
  span.wm{width:104px;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:left center;mask-position:left center;
    -webkit-mask-size:contain;mask-size:contain;}
  [dir="rtl"] img.wm{object-position:right center;}
  [dir="rtl"] span.wm{-webkit-mask-position:right center;mask-position:right center;}
  img.wm.inv{filter:brightness(0) invert(1);}
  .wm-d{display:none !important;}
  :root[data-theme="dark"] .wm-l{display:none !important;} :root[data-theme="dark"] .wm-d{display:block !important;}
  @media(prefers-color-scheme:dark){:root[data-theme="auto"] .wm-l{display:none !important;} :root[data-theme="auto"] .wm-d{display:block !important;}}
  /* Jul 2026: wordmark SVGs were re-cut to their true ink. Southwest and
     jetBlue previously carried heavy canvas padding — compensate here. */
  img.wm[src*="southwest-wordmark"]{height:12px;}
  img.wm[src*="jetblue-wordmark"]{height:13px;}
  /* v23962 — a name is never cut: an airline name too long for the card's
     line takes a second one at a space or hyphen ('Pacific Coastal…'). */
  .wm-txt{font-weight:750;font-size:13.5px;color:var(--txt);letter-spacing:-0.005em;line-height:1.15;
    white-space:normal;overflow-wrap:normal;word-break:normal;overflow:visible;text-overflow:clip;}
  .fcard .alname{font-weight:750;font-size:13.5px;line-height:1.15;white-space:normal;overflow-wrap:normal;word-break:normal;overflow:visible;text-overflow:clip;}
  /* v24043 — THE PLACE, NEVER CUT INSIDE A NAME. The city and the airport's
     own name are two units, as the board sets them ('Toronto · Billy
     Bishop', the airport a step smaller): a line breaks only between them,
     never inside 'Billy Bishop' and never after a hanging '·'. The '·' rides
     on the airport's name, in the room the city's line is shifted by, so on a
     second line it falls outside the box and is not drawn (the board drops
     it there too). A unit wider than the whole line still wraps, never cut. */
  .fcard .city{grid-column:2;grid-row:2;font-size:16px;font-weight:750;line-height:1.15;letter-spacing:-.01em;min-width:0;overflow:hidden;padding-bottom:1px;}
  .pl-in{display:block;margin-inline-start:-.8em;}
  .pl-c,.pl-q{display:inline-block;max-width:100%;white-space:normal;overflow-wrap:break-word;vertical-align:baseline;}
  .pl-c{padding-inline-start:.8em;}
  .pl-q{padding-inline-start:.8em;position:relative;}
  .pl-q::before{content:'·';position:absolute;inset-inline-start:0;width:.8em;text-align:center;}
  .pl-q > span{font-size:.84em;font-weight:650;}
  .fcard .sub{grid-column:2;grid-row:3;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:1px;min-width:0;}
  .fcard .sub b{color:var(--txt);font-weight:800;letter-spacing:.02em;}
  .fcard .sub .fno{direction:ltr;unicode-bidi:isolate;white-space:nowrap;}
  /* the temperature is isolated on its own, its ' · ' outside it, so in
     Arabic the line reads 'YYZ · AC1983 · 11°C' from the right, never
     '· 11°CAC1983' */
  .wx{white-space:nowrap;}
  .wx bdi{direction:ltr;unicode-bidi:isolate;}
  .fcard .sub .st{display:none;}
  /* the gate (a belt on arrivals) in its own box, TBD until the airport says */
  .slot{grid-column:3;grid-row:2 / 4;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:58px;max-width:88px;min-height:44px;border-radius:10px;background:var(--slot);color:var(--slot-ink);padding:4px 4px;text-align:center;}
  /* v24043 — the box's word is 10 px or more in every language (it was 8.5,
     and 7.5 for CARROUSEL); the box widens for a long word instead */
  .slot .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:750;color:var(--muted);line-height:1.1;white-space:nowrap;}
  .slot .v{contain:inline-size;align-self:stretch;font-size:21px;font-weight:800;line-height:1.05;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;direction:ltr;unicode-bidi:isolate;}
  .slot .v.l3{font-size:18px;} .slot .v.l4{font-size:15px;} .slot .v.l5{font-size:12.5px;}
  .slot .v.tbd{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:0;white-space:normal;}
  /* status: one solid pill, its own background — never the airline's colour under it */
  .st{display:inline-flex;align-items:center;gap:5px;font-weight:750;font-size:11.5px;line-height:1.2;white-space:nowrap;
    padding:3px 8px 3px 7px;border-radius:999px;margin-inline-start:auto;}
  .st .d{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .st.ontime{color:var(--ok-ink);background:var(--ok-bg);} .st.delayed,.st.early{color:var(--late-ink);background:var(--late-bg);}
  .st.cancelled{color:var(--cx-ink);background:var(--cx-bg);} .st.boarding{color:var(--brd-ink);background:var(--brd-bg);}
  /* v24030 — Scheduled / Expected: the airport's neutral word, no status colour */
  .st.neutral{color:var(--muted);}
  .st.neutral{background:var(--neu-bg);}
  /* v24043 — a flight that has gone: still listed, in the sheet's own quieter
     ink (4.5:1 or better), not faded (opacity .66 took its words to 3:1);
     the time it went is plain, amber is for a flight still to go */
  .fcard.done .hh,.fcard.done .city,.fcard.done .sub b{color:var(--muted);}
  /* the departures that have gone, folded into one line above the list */
  .gone{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;border:1px dashed var(--line2);border-radius:var(--radius);
    background:none;color:var(--muted);font-size:13px;font-weight:700;text-align:start;}
  .gone .ic{width:16px;height:16px;stroke-width:2.2;flex:none;}
  /* cancelled: the board's red row — the whole card, the time struck */
  .fcard.cx{background:var(--cx);border-color:transparent;}
  .fcard.cx .hh,.fcard.cx .city,.fcard.cx .sub b,.fcard.cx .wm-txt{color:#ffffff;}
  .fcard.cx .hh{display:inline-block;position:relative;}
  .fcard.cx .sub{color:rgba(255,255,255,.86);}
  .fcard.cx .st{background:rgba(0,0,0,.24);color:#ffffff;}
  .fcard.cx .slot{background:rgba(255,255,255,.14);color:#ffffff;}
  .fcard.cx .slot .k,.fcard.cx .slot .v.tbd{color:rgba(255,255,255,.86);}
  .fcard.cx .wm-l{display:none !important;} .fcard.cx .wm-d{display:block !important;}
  /* v24043 — WHEN THE STATUS HAS NO ROOM BESIDE THE AIRLINE. On a small phone
     (and at 360 px in the longer languages: 'Programado', 'Gate
     geschlossen') the status pill dropped to a line of its own on every row
     and the rows jumped between four heights. Then the whole list (.tight,
     set by fitRows when any row's pill would wrap, and always under 360 px)
     takes the same three lines: the airline; the place; the code and flight
     number with the status at the end, under the gate box. The row's
     temperature stays on the flight's own page there: on the row it pushed
     the status to a fourth line. */
  .cards.tight .fcard .l1{grid-column:2;}
  .cards.tight .fcard .l1 .st{display:none;}
  .cards.tight .slot{grid-row:1 / 3;}
  .cards.tight .fcard .sub{grid-column:2 / 4;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;margin-top:4px;}
  .cards.tight .fcard .sub .sx{min-width:0;}
  .cards.tight .fcard .sub .st{display:inline-flex;}
  .cards.tight .fcard .sub .wx{display:none;}
  /* a small phone (under 360 px): the time column narrows to 62 px with
     AM/PM under its digits, and the airline's mark is capped at 88 x 13 */
  @media (max-width:359.98px){
    .fcard{grid-template-columns:62px minmax(0,1fr) auto;column-gap:8px;padding:8px 9px 9px 10px;}
    .fcard .hh small{display:block;margin:3px 0 0;font-size:.55em;}
    img.wm{max-width:88px;height:13px;}
    span.wm{width:88px;height:13px;}
    img.wm[src*="southwest-wordmark"]{height:11px;}
    img.wm[src*="jetblue-wordmark"]{height:12px;}
  }
  /* the day changes: Tomorrow, with its date, held at the top while its flights scroll */
  .day{position:sticky;top:var(--hdr-h);z-index:5;display:flex;align-items:center;gap:10px;margin:6px -12px 0;padding:6px 12px;
    background:var(--bg);}
  .day span{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--band);color:#ffffff;
    font-size:12px;font-weight:750;letter-spacing:.01em;white-space:nowrap;}
  .day span .ic{width:14px;height:14px;}
  .day::after{content:'';flex:1;height:1px;background:var(--line2);}
  .more{height:1px;}
  /* loading: the rows' own shape, no words to misread */
  .sk{display:grid;grid-template-columns:74px minmax(0,1fr) 58px;column-gap:10px;align-items:center;height:80px;padding:12px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);}
  .sk i{display:block;height:12px;border-radius:6px;background:var(--line2);}
  .sk .a{height:20px;width:58px;} .sk .m i+i{margin-top:9px;} .sk .m i:first-child{width:60%;} .sk .m i:nth-child(2){width:85%;height:15px;} .sk .m i:nth-child(3){width:45%;}
  .sk .s{height:46px;border-radius:10px;}
  .sk i{background-image:linear-gradient(90deg,transparent 0,rgba(255,255,255,.35) 50%,transparent 100%);background-size:200% 100%;background-repeat:no-repeat;animation:sheen 1.4s ease-in-out infinite;}
  :root[data-theme="dark"] .sk i{background-image:linear-gradient(90deg,transparent 0,rgba(255,255,255,.07) 50%,transparent 100%);}
  @media(prefers-color-scheme:dark){:root[data-theme="auto"] .sk i{background-image:linear-gradient(90deg,transparent 0,rgba(255,255,255,.07) 50%,transparent 100%);}}
  @keyframes sheen{from{background-position:150% 0;}to{background-position:-50% 0;}}
  @media (prefers-reduced-motion: reduce){.sk i{animation:none;}}
  .empty{padding:56px 28px;text-align:center;color:var(--muted);}
  .empty .ic{width:36px;height:36px;color:var(--faint);margin:0 auto 14px;}
  .empty .h{font-size:16px;font-weight:750;color:var(--txt);}
  .empty .p{font-size:13px;font-weight:550;margin-top:6px;}

  /* ── Flight detail ───────────────────────────────── */
  .detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;
    transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s linear .28s;
    padding-bottom:calc(28px + env(safe-area-inset-bottom));}
  .detail.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.4,0,.2,1),visibility 0s;}
  [dir="rtl"] .detail{transform:translateX(-100%);} [dir="rtl"] .detail.show{transform:none;}
  .dt-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--head);box-shadow:0 1px 0 var(--line);}
  .dt-top .back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card);
    color:var(--txt);display:flex;align-items:center;justify-content:center;flex:none;}
  [dir="rtl"] .dt-top .back svg{transform:scaleX(-1);}
  .dt-top .ttl{font-size:15.5px;font-weight:750;color:var(--head-ink);}
  /* the hero takes the airline's own colours, as its gate does: flat, as the
     boards' airline panels are (the white gloss over it turned Air Canada's
     black grey at the top). v24043 — on the night page a carrier whose bar
     colour is light (Porter's cream) takes its own dark colour instead, with
     its white lettering: a light slab with dark words in the middle of the
     night page is a light box behind a logo. */
  .dt-hero{position:relative;overflow:hidden;margin:12px 12px 0;border-radius:18px;padding:20px 18px 14px;text-align:center;
    background:var(--hero,#0b1f3a);color:var(--hero-ink,#ffffff);}
  :root[data-theme="dark"] .dt-hero{background:var(--hero-n,var(--hero,#0b1f3a));color:var(--hero-ink-n,var(--hero-ink,#ffffff));}
  @media(prefers-color-scheme:dark){:root[data-theme="auto"] .dt-hero{background:var(--hero-n,var(--hero,#0b1f3a));color:var(--hero-ink-n,var(--hero-ink,#ffffff));}}
  .dt-brand{display:flex;align-items:center;justify-content:center;gap:10px;min-height:34px;}
  .dt-brand .tile{width:34px;height:34px;border-radius:9px;}
  .dt-brand .tile.mono{font-size:12px;}
  .dt-brand .wm{height:22px;}
  .dt-brand img.wm{max-width:58vw;object-position:center;}
  .dt-brand span.wm{width:160px;-webkit-mask-position:center;mask-position:center;}
  .dt-name{font-size:17px;font-weight:750;}
  .dt-hero .flt{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:10px;direction:ltr;unicode-bidi:isolate;}
  .dt-hero .al-op{font-size:13px;font-weight:550;margin-top:4px;opacity:.88;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .dt-hero .al-op img{height:22px;width:auto;max-width:170px;object-fit:contain;}
  .dt-illus{display:block;width:250px;max-width:86%;margin:10px auto 0;}
  .dt-route{display:grid;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr);align-items:start;gap:6px;margin:14px 12px 0;padding:16px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .dt-route .ep{text-align:center;min-width:0;}
  .dt-route .ep .code{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1;color:var(--txt);}
  .dt-route .ep .city{font-size:13px;font-weight:650;color:var(--muted);margin-top:6px;line-height:1.2;}
  /* in the route card's narrow, centred column the airport's name goes under
     its city, without the '·' (the board's own second-line form) */
  .dt-route .ep .pl-in{margin-inline-start:0;}
  .dt-route .ep .pl-c,.dt-route .ep .pl-q{display:block;padding-inline-start:0;}
  .dt-route .ep .pl-q::before{content:none;}
  .dt-route .ep .wx{display:block;margin-top:5px;font-size:15px;font-weight:800;color:var(--txt);}
  /* the boards' own plane (logos/icons/plane.svg), in the page's ink */
  .dt-route .pl{align-self:center;color:var(--txt);display:flex;justify-content:center;margin-top:2px;}
  .dt-route .pl .tic{width:22px;height:22px;transform:rotate(90deg);}
  [dir="rtl"] .dt-route .pl .tic{transform:rotate(-90deg);}
  .dt-status{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 12px 4px;}
  .dt-status .st{font-size:14px;padding:6px 14px 6px 12px;margin:0;}
  .dt-status .st .d{width:8px;height:8px;}
  .dt-status .when{font-size:12.5px;font-weight:650;color:var(--muted);}
  /* cancelled: a full red band, not a small red word */
  .dt-cx{margin:14px 12px 0;padding:14px 16px;border-radius:14px;background:var(--cx);color:#ffffff;text-align:center;font-size:18px;font-weight:800;letter-spacing:-.01em;}
  .dt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 0;}
  /* v24043 — a fact alone on its line takes the whole line (a cancelled
     flight's detail was one half-width card beside a blank) */
  .dt-grid > .dt-cell:last-child:nth-child(odd){grid-column:1 / -1;}
  .dt-cell{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);min-width:0;}
  .dt-cell.wide{display:flex;align-items:center;gap:13px;margin:10px 12px 0;}
  /* the gate is marked by its size, the board's big gate number, on the same
     ground as the time beside it */
  .dt-cell .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .dt-cell .v{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:5px;color:var(--txt);overflow-wrap:break-word;}
  .dt-cell .v.big{font-size:30px;line-height:1;}
  .dt-cell.key .v.big{font-size:40px;}
  .dt-cell .v.moved{color:var(--moved);}
  .dt-cell .v.tbd{color:var(--muted);font-size:18px;}
  .dt-cell .v.was{font-size:14px;color:var(--muted);margin-top:4px;}
  .dt-cell .v.strike{color:var(--muted);}
  .dt-cell .v.strike .ltr,.dt-cell .v.was .ltr{position:relative;display:inline-block;}
  .dt-cell .sub{font-size:12px;color:var(--muted);font-weight:550;margin-top:3px;}
  .dt-cell .planeic{width:44px;height:44px;border-radius:12px;flex:none;background:var(--slot);color:var(--txt);
    display:flex;align-items:center;justify-content:center;}
  .dt-cell .planeic .tic{width:24px;height:24px;}
  .dt-cell .ltr{direction:ltr;unicode-bidi:isolate;}
  .dt-credit{margin:16px 18px 0;font-size:11px;font-weight:550;color:var(--muted);text-align:center;line-height:1.35;}
  .detail .dt-credit:empty{display:none;}

  /* ── Full-page ad ────────────────────────────────── */
  .ad-full{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:34px;background:var(--bg);}
  .ad-full.show{display:flex;animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
  .ad-full .tile{width:92px;height:92px;border-radius:26px;margin-bottom:22px;background:var(--soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .ad-full .tile .ic{width:44px;height:44px;}
  .ad-full .creative{width:100%;max-width:360px;max-height:48vh;object-fit:contain;border-radius:16px;
    margin-bottom:22px;box-shadow:var(--shadow);background:#fff;}
  .ad-full .t{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.15;}
  .ad-full .s{color:var(--muted);font-size:15px;margin-top:12px;max-width:300px;font-weight:500;line-height:1.5;}
  .ad-full .cta{margin-top:26px;background:var(--accent);color:#fff;border:0;border-radius:13px;padding:14px 28px;font-family:inherit;font-size:15px;font-weight:700;box-shadow:var(--shadow);}
  .ad-full .skip{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:18px;background:var(--card);
    color:var(--muted);border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
  .ad-full .skip .ic{width:18px;height:18px;}
  .ad-full .tag{position:absolute;top:calc(env(safe-area-inset-top) + 20px);left:20px;font-size:9px;letter-spacing:.15em;color:var(--faint);text-transform:uppercase;font-weight:600;}
</style>

<body>

<!-- v24043 — the phone board's frame: the airport's logo and clock, then the
     band with Departures and Arrivals. Every word on it is written from the
     store at boot (applyLang); the markup itself carries none. The tab bar is
     gone: Explore and Trip had nothing behind them, the person button opened
     an English-only alert, and Baggage was Arrivals a second time — the belt
     is now on every arrival, where the gate is on a departure. -->
<header class="topbar" id="topbar">
  <div class="tb-row">
    <div class="brand" id="brand">
      <span class="logo" id="apLogo"></span>
      <b class="apn" id="apName"></b>
      <svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
      <select id="apSelect" aria-label="Choose airport" onchange="setAirport(this.value)"></select>
    </div>
    <div class="clock"><div class="t" id="clkT"></div><div class="d" id="clkD"></div></div>
  </div>
  <div class="band">
    <div class="seg">
      <button id="segDep" class="active" onclick="setDir('dep')"><span class="tic dep" aria-hidden="true"></span><span id="segDepT"></span></button>
      <button id="segArr" onclick="setDir('arr')"><span class="tic arr" aria-hidden="true"></span><span id="segArrT"></span></button>
    </div>
    <span class="tb-btn" title="Language / Langue / Idioma"><span id="langBtn">EN</span><select id="langSelect" onchange="pickLang(this.value)"></select></span>
    <button class="tb-btn" id="themeBtn" title="Theme" onclick="cycleTheme()"><span id="themeIc"></span></button>
  </div>
</header>

<!-- FLIGHTS -->
<main class="view active" id="view-flights">
  <div class="search-wrap">
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" oninput="onSearch()">
    </div>
  </div>
  <div class="hint"><span class="live wait" id="liveDot"></span><span id="hint"></span></div>

  <div class="ad-banner" id="adBanner" onclick="bannerTap()">
    <span class="tag">Sponsored</span>
    <span class="tile" id="adBanTile"></span>
    <div><div class="t" id="adBanT">Grab a coffee before you fly</div><div class="s" id="adBanS">Offers near your gate — tap to see</div></div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="dt-credit" id="wxCredit" hidden></div>
</main>

<!-- Flight detail -->
<div class="detail" id="detail" aria-hidden="true">
  <div class="dt-top">
    <button class="back" onclick="closeFlight()"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="ttl" id="dtTtl"></div>
  </div>
  <div id="detailBody"></div>
</div>

<div class="ad-full" id="adFull">
  <span class="tag">Advertisement</span>
  <button class="skip" onclick="closeFullAd()"><svg class="ic" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  <img class="creative" id="adFullImg" alt="" style="display:none">
  <div class="tile" id="adFullIcon"></div>
  <div class="t" id="adFullTitle">Duty-free, your way</div>
  <div class="s" id="adFullSub">Pre-order and pick up at the gate.</div>
  <button class="cta" onclick="closeFullAd()">Explore offers</button>
</div>

<!-- v24030 — the boards' store: the clock rule (boardTime) and their words -->
<script src="js/board-strings.js?v=24055"></script>
<script src="js/shared-names.js?v=24055"></script>

<script>
const PROXY='https://fids-proxy.n-leblanc1984.workers.dev';
const SVG={

  shop:'<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',

  car:'<path d="M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13"/><path d="M4 13h16v4a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>'
};
const FULL_ADS=[
  {img:'/logos/advertisements/app/airnova-spread.png',t:'A Class Above',s:'Air Nova — the Air Canada Connector'},
  {ic:'shop',t:'Duty-free, your way',s:'Pre-order and pick up at the gate.'},

];

// Full airport catalogue — same network the big board serves. n=short name,

const AIRPORTS={
  // ── Canada ──
  YQM:{n:'Moncton',tz:'America/Moncton',r:'CA'},
  YHZ:{n:'Halifax Stanfield',tz:'America/Halifax',r:'CA'},
  YYT:{n:"St. John's",tz:'America/St_Johns',r:'CA'},
  YYZ:{n:'Toronto · Pearson',tz:'America/Toronto',r:'CA'},
  YTZ:{n:'Toronto · Billy Bishop',tz:'America/Toronto',r:'CA'},
  YHU:{n:'Montréal · Métropolitain',tz:'America/Toronto',r:'CA'},
  YUL:{n:'Montréal · Trudeau',tz:'America/Toronto',r:'CA'},
  YOW:{n:'Ottawa',tz:'America/Toronto',r:'CA'},
  YQB:{n:'Québec City',tz:'America/Toronto',r:'CA'},
  YWG:{n:'Winnipeg',tz:'America/Winnipeg',r:'CA'},
  YYC:{n:'Calgary',tz:'America/Edmonton',r:'CA'},
  YEG:{n:'Edmonton',tz:'America/Edmonton',r:'CA'},
  YVR:{n:'Vancouver',tz:'America/Vancouver',r:'CA'},
  YYJ:{n:'Victoria',tz:'America/Vancouver',r:'CA'},
  YXX:{n:'Abbotsford',tz:'America/Vancouver',r:'CA'},
  // v24043 — the live airports this catalogue never had. A code missing here
  // could not be opened at all: a phone redirected from the Fredericton or

  paintHeader();
  closeFlight(true);
  const q=document.getElementById('q'); if(q&&!_boot)q.value='';
  window.scrollTo(0,0);
  startView();
  load();
  loadBrand(code);
  measureHeader();
}
// Operator logo (Rouge/Jazz/PAL/Encore) for the detail view, picked light/dark
// for the current app theme so it stays visible. Falls back to the name text.
const OP_LOGO={
  'Air Canada Rouge':{d:'/logos/airlines/canadian/rouge-monochrome-white.svg',                 l:'/logos/airlines/canadian/rouge-monochrome-black.svg'},
  'Jazz':            {d:'/logos/airlines/canadian-regional/jazz-wordmark-light.svg',           l:'/logos/airlines/canadian-regional/jazz-wordmark-dark.svg'},
  'PAL Airlines':    {d:'/logos/airlines/canadian-regional/PAL-Airlines-monochrome-white.svg', l:'/logos/airlines/canadian-regional/PAL-Airlines-monochrome-black.svg'},
  'WestJet Encore':  {d:'/logos/airlines/canadian/encore.png',                                 l:'/logos/airlines/canadian/encore.png'}
};
// lightGround: the hero is light by day and dark at night (Porter), so both
// marks are drawn and the theme shows one
function opLogoHtml(name,lightGround){
  const v=OP_LOGO[name]; if(!v) return '';
  const img=function(u,cls){return '<img'+(cls?' class="'+cls+'"':'')+' src="'+u+'" alt="'+esc(name)+'" onerror="this.outerHTML=&quot;'+esc(name)+'&quot;">';};
  return lightGround?img(v.l,'wm-l')+img(v.d,'wm-d'):img(v.d,'');
}
// v24043 — THE FLIGHT. The hero wears the airline's colours; then the route
// as codes, the status (a cancelled flight's is a full red band, and its
// times are struck, its gate not offered), the day it flies, and the facts in
// the order a passenger needs them: the time (the airport's new time first
// when it moved), the gate or belt, the terminal, the far end, the aircraft.
// v24043 — what the boards show for the same flight is here too: the weather
// at the other end (the phone board's row: 'AC1983 Gate 4 11°C') and the
// aircraft before it flies (the gate screens' /acinfo: the far end's own
// feed, else the type this number usually flies — no FR24 call, no credit),
// with its livery art.
function openFlight(i){
  const f=RENDERED[i]; if(!f)return;
  DETAIL_I=i;
  const s=statusOf(f), name=airlineName(f), key=flightKey(f);
  const sched=(f.schedTime||'').slice(0,5), est=(f.estTime||'').slice(0,5);
  const isArr=f.dir==='arr', cx=f.state==='cancelled', done=isDone(f);
  const moved=!cx&&movedTime(f);
  const hc=heroColors(f.airline);
  const aci=ACI[key]||null, acRaw=f.aircraft||(aci&&aci.type)||'', reg=f.reg||(aci&&aci.reg)||'';
  // the far end's real code, for the weather lookups only (what is printed
  // goes through dispIata)
  const oc=String(f.cityIata||'');
  if(!acRaw&&!cx)acKick(f);
  const opLine=!!(f.operatedBy&&f.operatedBy.toUpperCase()!==name.toUpperCase()&&f.operatedBy.toUpperCase()!==String(AIRLINE[f.airline]||'').toUpperCase());
  function cell(k,v,o){o=o||{};
    const vc=(o.big?' big':'')+(o.moved?' moved':'')+(o.tbd?' tbd':'')+(o.strike?' strike':'');
    return '<div class="dt-cell'+(o.key?' key':'')+'"><div class="k">'+esc(k)+'</div><div class="v'+vc+'">'+(o.html?v:esc(v))+'</div>'
      +(o.was?'<div class="v was">'+o.was+'</div>':'')+(o.sub?'<div class="sub">'+esc(o.sub)+'</div>':'')+'</div>';}
  const tLbl=isArr?T('arrives'):T('departs');
  let cells='';
  if(moved) cells+=cell(tLbl,'<span class="ltr">'+clk(est)+'</span>',{html:true,big:true,moved:!done,was:'<span class="ltr">'+clk(sched)+'</span>'});
  else cells+=cell(tLbl,sched?'<span class="ltr">'+clk(sched)+'</span>':'—',{html:true,big:true,strike:cx});
  if(!cx){const gv=String((isArr?f.belt:f.gate)||'').trim();cells+=cell(isArr?T('bagBelt'):T('gate'),gv||T('tbd'),{key:true,big:!!gv,tbd:!gv});}
  if(f.terminal&&!cx) cells+=cell(T('terminal'),f.terminal);
  // v24030 — only a real far-end time (both legs' times known, a flight time
  // above zero): a feed that repeats this airport's time there printed
  // "Arr 14:30" for a 14:30 departure
  const otherLine=(f.otherTime&&f.durMin>0)?cell(isArr?T('depOrigin'):T('arrives'),'<span class="ltr">'+clk((f.otherTime||'').slice(0,5))+'</span>',{html:true,strike:cx}):'';
  cells+=otherLine;
  var _dur=fmtDur(f.durMin); if(_dur) cells+=cell(T('flightTime'),_dur);
  if(f.via&&f.via.length) cells+=cell(T('via'),f.via.map(c=>CITY[c]||c).join(', '));
  const plane=acRaw?('<div class="dt-cell wide"><div class="planeic"><span class="tic pln" aria-hidden="true"></span></div>'
    +'<div><div class="k">'+esc(T('aircraft'))+'</div><div class="v">'+esc(acName(acRaw))+'</div>'
    +(reg?'<div class="sub">'+esc(T('reg'))+' '+esc(reg)+'</div>':'')+'</div></div>'):'';
  // Route endpoints: for an arrival, origin → here; for a departure, here → destination.
  const epHere='<div class="ep"><div class="code">'+esc(dispIata(CURAP))+'</div><div class="city">'+placeHtml(placeOf(CURAP))+'</div></div>';
  const epOther='<div class="ep"><div class="code">'+esc(dispIata(f.cityIata||''))+'</div><div class="city">'+placeHtml(placeOf(f.cityIata,f.cityName))+'</div>'
    +(WX_ON?'<span class="wx ep-wx" data-wx="'+esc(oc)+'">'+(wxTemp(f.cityIata)?'<bdi>'+esc(wxTemp(f.cityIata))+'</bdi>':'')+'</span>':'')+'</div>';
  const when=f.schedDate?dayLabel(f.schedDate):'';
  document.getElementById('detailBody').innerHTML=
    '<div class="dt-hero" style="--hero:'+esc(hc.bg)+';--hero-ink:'+esc(hc.ink)+(hc.night?';--hero-n:'+esc(hc.night)+';--hero-ink-n:#ffffff':'')+'">'+heroBrand(f.airline,name,hc.light)
    +'<div class="flt">'+esc(f.flight)+'</div>'
    +(opLine?'<div class="al-op">'+esc(T('operatedBy'))+' '+(opLogoHtml(f.operatedBy,hc.light)||esc(f.operatedBy))+'</div>':'')
    +liveryImg(f.airline,acRaw,f.operatedBy)+'</div>'
    +'<div class="dt-route">'+(isArr?epOther:epHere)
    +'<span class="pl"><span class="tic pln" aria-hidden="true"></span></span>'
    +(isArr?epHere:epOther)+'</div>'
    +(cx?'<div class="dt-cx">'+esc(capFirst(s.t))+'</div>'+(when?'<div class="dt-status"><span class="when">'+esc(when)+'</span></div>':'')
        :'<div class="dt-status"><span class="st '+s.c+'"><span class="d"></span>'+esc(capFirst(s.t))+'</span>'+(when?'<span class="when">'+esc(when)+'</span>':'')+'</div>')
    +'<div class="dt-grid">'+cells+'</div>'+plane
    +'<div class="dt-credit" data-wxc="'+esc(oc)+'">'+(WX_ON&&wxTemp(f.cityIata)?esc(BoardStrings.bs('wxCredit',langRes())):'')+'</div>';
  if(WX_ON&&f.cityIata)wxKick([f.cityIata]);
  const d=document.getElementById('detail'), wasOpen=d.classList.contains('show');
  if(!wasOpen)d.scrollTop=0;
  d.classList.add('show');d.setAttribute('aria-hidden','false');
  // the phone's own Back closes the flight, not the app
  if(!wasOpen){try{history.pushState({appDetail:1},'');}catch(e){}}
}
function closeFlight(fromHistory){
  const d=document.getElementById('detail'); if(!d||!d.classList.contains('show'))return;
  d.classList.remove('show');d.setAttribute('aria-hidden','true');DETAIL_I=-1;
  if(!fromHistory){try{if(history.state&&history.state.appDetail)history.back();}catch(e){}}
}
window.addEventListener('popstate',function(){closeFlight(true);});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeFlight();});
function bannerTap(){showFullAd();}

/* ── Theme: auto (system) / light / dark ── */
const THEMES=['auto','light','dark'];
const THEME_IC={
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  light:'<circle cx="12" cy="12" r="4.2"/><line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/><line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/><line x1="5.3" y1="5.3" x2="7" y2="7"/><line x1="17" y1="17" x2="18.7" y2="18.7"/><line x1="18.7" y1="5.3" x2="17" y2="7"/><line x1="7" y1="17" x2="5.3" y2="18.7"/>',
  dark:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/>'
};
function isDark(t){return t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',isDark(t)?'#081a33':'#ffffff');
  const ic=document.getElementById('themeIc');
  if(ic)ic.innerHTML='<svg class="ic" viewBox="0 0 24 24" style="width:20px;height:20px">'+THEME_IC[t]+'</svg>';
  const btn=document.getElementById('themeBtn');
  if(btn)btn.title='Theme: '+t;
}
function cycleTheme(){
  let t=localStorage.getItem('app_theme')||'auto';
  t=THEMES[(THEMES.indexOf(t)+1)%THEMES.length];
  try{localStorage.setItem('app_theme',t);}catch(e){}
  applyTheme(t);
}
applyTheme((function(){try{return localStorage.getItem('app_theme')||'auto';}catch(e){return 'auto';}})());
buildLangOptions();
applyLang();   // v23234 — localize static chrome before first paint
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{
  const t=localStorage.getItem('app_theme')||'auto'; if(t==='auto')applyTheme('auto');
});}catch(e){}

// v23338 — the airports that actually serve data. Mirrors FIDS_LIVE_AIRPORTS in
// fids-core.js (the board's own list); tests/live-airports.test.js fails if the
// two drift apart or if the worker gains a handler neither of them knows about.
const APP_LIVE_AIRPORTS = new Set([
  'HBA','YYZ','DCA','IAD',
  'TPA','YUL','LGA','EWR','YTZ','YHU',   // v23420 dedicated-route feeds
  'YQM','YHZ','YYT','YSJ','YFC','YQY','YQX','YYG','YDF',
  'YOW','YQB','YQT','YHM','YXX','YLW','YQR','YXE','YYC','YEG',
  'YYJ','YKA','YXS','YMM',
  'BOS','ORD','SFO','SEA','DEN','LAS','AUS','SLC','PHL','MSP',
  'CLT','MCI','RDU','SAN','PDX','DTW','MSY',
  'PHX','YZF',
  'MIA',
  'ZRH',
  'JFK',
  'IAH','MCO',
  'LHR','DUB','EDI','KEF',
  'SYD'   // v23772
]);
// Build the airport picker from the catalogue, grouped by region, its
// headings in the app's language (rebuilt when the language changes).
// v24043 — a name the way the boards write it: the city, then the airport's
// own name where its city has two ('Toronto · Billy Bishop', 'Billy-Bishop'
// in French), then its code, the line's only bracket.
function pickerName(k){
  const sub=apSub(k,true), a=AIRPORTS[k];
  if(sub)return (CITY[k]||String(a?a.n:k).split(' · ')[0])+' · '+sub;
  return a?a.n:(CITY[k]||k);
}
function buildAirportOptions(){
  const sel=document.getElementById('apSelect');
  const groups={CA:[],US:[],INT:[]};
  // v23338 — ONLY AIRPORTS THAT HAVE DATA ARE OFFERED
  // AeroDataBox is gone; a board fills only where the
  // worker has a handler for that airport, and everything else returns an
  // empty 200 forever. The board's picker was filtered in v23335; this is the
  // same list for the mobile companion. AIRPORTS keeps every entry because its
  // names and timezones still label destinations — only the PICKER is cut.
  for(const k in AIRPORTS){ if(!APP_LIVE_AIRPORTS.has(k)) continue; (groups[AIRPORTS[k].r]||(groups.INT)).push(k);}
  let html='';
  ['CA','US','INT'].forEach(r=>{
    if(!groups[r].length)return;
    html+='<optgroup label="'+esc(T(REGION_KEY[r]))+'">';
    groups[r].forEach(k=>{html+='<option value="'+k+'">'+esc(pickerName(k))+' ('+esc(dispIata(k))+')</option>';});
    html+='</optgroup>';
  });
  sel.innerHTML=html;
  // an airport outside the list (a link to one with no feed) stays chosen
  try{if(CURAP){ensureOption(CURAP);sel.value=CURAP;}}catch(e){}
}
buildAirportOptions();
// ── CONNECTED BOOT
// The app joins the same URL state the boards write:
//   ?ap=MCO                  → that airport (else the tab's fids_airport,
//                              else the app's last airport, else YQM)
//   ?screen=baggage / ?belt= → open Arrivals, where every belt now is
//   ?gate=95                 → auto-open that gate's next departure
// Board links opened on a phone land here (fids-core hands off to app.html)
// with their query intact — same link, same screen, phone gets the app.
// v24043 — the link's airport is the airport shown. A code the catalogue did
// not know used to fall through to Moncton and rewrite the link to ?ap=YQM;
// now a live airport opens, and any other code opens as itself with no live
// data, said in so many words.
let BOOT_GATE='';
(function(){
  let ap='';
  try{
    const q=new URLSearchParams(location.search);
    let uAp=(q.get('ap')||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(uAp.length===4&&!AIRPORTS[uAp]&&AIRPORTS[uAp.slice(1)])uAp=uAp.slice(1);   // CYQM → YQM
    if(!/^[A-Z0-9]{3}$/.test(uAp))uAp='';
    let ss='',ls='';
    try{ss=(sessionStorage.getItem('fids_airport')||'').toUpperCase();}catch(e){}
    try{ls=(localStorage.getItem('app_airport')||'').toUpperCase();}catch(e){}
    ap=uAp||[ss,ls].find(c=>c&&AIRPORTS[c]&&APP_LIVE_AIRPORTS.has(c))||'YQM';
    BOOT_GATE=(q.get('gate')||'').trim();
    const scr=(q.get('screen')||'').toLowerCase();
    if(scr==='baggage'||q.get('belt')||q.get('carousel')){
      DIR='arr';
    }
    paintSeg();
  }catch(e){ap='YQM';}
  setAirport(ap||'YQM',true);
})();
// Refresh the list (every 3 min), holding the reader's place; the clock every 15 s.
setInterval(()=>{ refresh(); },180000);
setInterval(()=>{ tickClock(); },15000);
let _rzT=0;
window.addEventListener('resize',()=>{ measureHeader(); clearTimeout(_rzT); _rzT=setTimeout(function(){fitRows(true);},150); });
try{document.fonts.ready.then(()=>{ measureHeader(); fitRows(true); });}catch(e){}
// v23230 — iOS RESUME WATCHDOG, same rule the boards carry (the reference 20:05
// screenshot: cards frozen at 18:20 — iOS suspends a background tab's
// timers, and a frozen WebKit context never fires them again). A heartbeat
// proves the JS context is alive; on pageshow/visibilitychange, data older
// than 3 minutes reloads immediately, and a heartbeat gap that says the
// context slept through its timers hard-reloads the page (60s loop guard).
window._appHeartbeat=Date.now();
setInterval(()=>{window._appHeartbeat=Date.now();},30000);
function _appMaybeCatchUp(){
  try{
    var now=Date.now(), gap=now-(window._appHeartbeat||now), stale=now-(window._appLastLoadAt||0);
    if(gap>3*60000){
      var last=+(sessionStorage.getItem('_appResumeReloadAt')||0);
      if(now-last>60000){ sessionStorage.setItem('_appResumeReloadAt',String(now)); location.reload(); return; }
    }
    if(stale>3*60000){ refresh(); }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)_appMaybeCatchUp(); });
window.addEventListener('pageshow',(e)=>{ if(e&&e.persisted)_appMaybeCatchUp(); });
rotateBanner();
setInterval(rotateBanner,10000);  // banner cycles offers
setTimeout(()=>{if(curView==='flights'&&!document.hidden)showFullAd();},9000);   // first ad appears early
setInterval(()=>{if(curView==='flights'&&!document.hidden)showFullAd();},35000); // then periodically
</script>

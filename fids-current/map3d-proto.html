<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D Route Map — Prototype (terrain)</title>
<link rel="stylesheet" href="/mapcdn/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;background:#05080f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  #map{position:absolute;inset:0;}
  #frame{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(120,160,250,.25);}
  #phase{position:absolute;left:18px;top:16px;z-index:5;color:#cfe0ff;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    background:rgba(8,14,30,.55);backdrop-filter:blur(6px);padding:8px 14px;border:1px solid rgba(120,160,250,.3);border-radius:8px;}
  #route{position:absolute;right:18px;top:16px;z-index:5;color:#fff;text-align:right;
    background:rgba(8,14,30,.55);backdrop-filter:blur(6px);padding:8px 14px;border:1px solid rgba(120,160,250,.3);border-radius:8px;}
  #route .big{font-size:22px;font-weight:800;letter-spacing:.02em;}
  #route .sub{font-size:12px;color:#9fb6e0;font-weight:600;}
  .maplibregl-ctrl-attrib{display:none !important;}
  .end-label{color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;
    background:rgba(8,14,30,.6);padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.18);transform:translateY(-22px);}
  .end-dot{width:14px;height:14px;border-radius:50%;background:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.35),0 0 14px rgba(96,165,250,.9);}
  .end-dot.dest{background:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.35),0 0 14px rgba(248,113,113,.9);}
</style>
</head>
<body>
  <div id="map"></div>
  <div id="frame"></div>
  <div id="phase">3D Terrain</div>
  <div id="route"><div class="big" id="rtCode">—</div><div class="sub" id="rtCity">—</div></div>
<script src="/mapcdn/maplibre-gl.js"></script>
<script>
(function(){
  'use strict';
  var TO_R = Math.PI/180, TO_D = 180/Math.PI;

  // Mountainous routes so the 3D relief is obvious (Coast Mtns / Rockies).
  var ROUTES = [
    { o:[-123.184,49.197], d:[-114.020,51.131], oc:'YVR', dc:'YYC', oCity:'Vancouver', dCity:'Calgary',  tag:'Over the Rockies' },
    { o:[-114.020,51.131], d:[-119.378,49.956], oc:'YYC', dc:'YLW', oCity:'Calgary',   dCity:'Kelowna',  tag:'Rockies → Okanagan' },
    { o:[-123.184,49.197], d:[-119.378,49.956], oc:'YVR', dc:'YLW', oCity:'Vancouver', dCity:'Kelowna',  tag:'Coast Mountains' }
  ];

  function greatCircle(a,b,n){
    var lon1=a[0]*TO_R, lat1=a[1]*TO_R, lon2=b[0]*TO_R, lat2=b[1]*TO_R;
    var dd = 2*Math.asin(Math.sqrt(Math.pow(Math.sin((lat2-lat1)/2),2)+Math.cos(lat1)*Math.cos(lat2)*Math.pow(Math.sin((lon2-lon1)/2),2)));
    if(dd===0) return [a,b];
    var pts=[];
    for(var i=0;i<=n;i++){
      var f=i/n, A=Math.sin((1-f)*dd)/Math.sin(dd), B=Math.sin(f*dd)/Math.sin(dd);
      var x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2);
      var y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2);
      var z=A*Math.sin(lat1)+B*Math.sin(lat2);
      pts.push([Math.atan2(y,x)*TO_D, Math.atan2(z,Math.sqrt(x*x+y*y))*TO_D]);
    }
    return pts;
  }
  function bearing(a,b){
    var y=Math.sin((b[0]-a[0])*TO_R)*Math.cos(b[1]*TO_R);
    var x=Math.cos(a[1]*TO_R)*Math.sin(b[1]*TO_R)-Math.sin(a[1]*TO_R)*Math.cos(b[1]*TO_R)*Math.cos((b[0]-a[0])*TO_R);
    return Math.atan2(y,x)*TO_D;
  }

  var map = new maplibregl.Map({
    container:'map',
    maxZoom:13,
    attributionControl:false,
    style:{
      version:8,
      sources:{
        sat:{ type:'raster', tiles:['/maptiles/{z}/{x}/{y}.png'], tileSize:256, attribution:'' },
        dem:{ type:'raster-dem', tiles:['/demtiles/{z}/{x}/{y}.png'], tileSize:256, encoding:'terrarium', maxzoom:13 }
      },
      layers:[
        { id:'bg', type:'background', paint:{ 'background-color':'#05080f' } },
        { id:'sat', type:'raster', source:'sat', paint:{ 'raster-fade-duration':300 } },
        { id:'hills', type:'hillshade', source:'dem',
          paint:{ 'hillshade-exaggeration':0.55, 'hillshade-shadow-color':'#0b1426', 'hillshade-highlight-color':'#ffffff' } }
      ]
    },
    center:[-119,50], zoom:6, pitch:0, bearing:0
  });

  var endMarkers=[];
  function clearMarkers(){ endMarkers.forEach(function(m){ m.remove(); }); endMarkers=[]; }
  function addEnd(coord, code, city, isDest){
    var el=document.createElement('div');
    var lab=document.createElement('div'); lab.className='end-label'; lab.textContent=code+' · '+city;
    var dot=document.createElement('div'); dot.className='end-dot'+(isDest?' dest':'');
    el.appendChild(lab); el.appendChild(dot);
    endMarkers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(coord).addTo(map));
  }

  function setRouteData(r){
    var gj={ type:'Feature', geometry:{ type:'LineString', coordinates:greatCircle(r.o,r.d,128) } };
    if(map.getSource('route')){ map.getSource('route').setData(gj); }
    else{
      map.addSource('route',{ type:'geojson', data:gj });
      map.addLayer({ id:'route-glow', type:'line', source:'route',
        layout:{ 'line-cap':'round','line-join':'round' },
        paint:{ 'line-color':'#7fb2ff','line-width':10,'line-opacity':.25,'line-blur':6 } });
      map.addLayer({ id:'route-line', type:'line', source:'route',
        layout:{ 'line-cap':'round','line-join':'round' },
        paint:{ 'line-color':'#eaf2ff','line-width':3,'line-dasharray':[2,1.6] } });
    }
    clearMarkers();
    addEnd(r.o,r.oc,r.oCity,false);
    addEnd(r.d,r.dc,r.dCity,true);
    document.getElementById('rtCode').textContent=r.oc+'  →  '+r.dc;
    document.getElementById('rtCity').textContent=r.oCity+' to '+r.dCity+' · '+r.tag;
  }
  function routeBounds(r){
    var b=new maplibregl.LngLatBounds();
    greatCircle(r.o,r.d,32).forEach(function(p){ b.extend(p); });
    return b;
  }

  var ph=document.getElementById('phase');
  var idx=0, timers=[];
  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

  function runRoute(){
    var r=ROUTES[idx % ROUTES.length];
    setRouteData(r);
    var brg=bearing(r.o,r.d);

    // Phase 1 — sit low and TILTED at the origin, looking down the route so the
    // mountains stand up in 3D.
    ph.textContent='3D Terrain';
    map.jumpTo({ center:r.o, zoom:7.6, pitch:74, bearing:brg });
    // Phase 2 — fly the camera along the route, over the 3D landscape.
    later(function(){
      map.easeTo({ center:r.d, zoom:7.6, pitch:74, bearing:brg, duration:7000, easing:function(t){return t<.5?2*t*t:-1+(4-2*t)*t;} });
    }, 600);
    // Phase 3 — pull up and FLATTEN to a top-down 2D view of the whole route.
    later(function(){
      ph.textContent='Flat 2D';
      var cam=null;
      try { cam=map.cameraForBounds(routeBounds(r),{ padding:{top:120,bottom:90,left:90,right:90}, maxZoom:9 }); } catch(e){}
      var to={ pitch:0, bearing:0, duration:3800 };
      if(cam){ to.center=cam.center; to.zoom=Math.min(cam.zoom||7,9); } else { to.center=r.d; to.zoom=7; }
      map.easeTo(to);
    }, 8000);
    // Phase 4 — hold, then next route.
    later(function(){ idx++; runRoute(); }, 13000);
  }

  map.on('load', function(){
    try { map.setTerrain({ source:'dem', exaggeration:1.6 }); } catch(e){}
    try { map.setSky({
      'sky-color':'#0a1736','sky-horizon-blend':0.55,
      'horizon-color':'#1a3b6e','horizon-fog-blend':0.5,
      'fog-color':'#070b14','fog-ground-blend':0.55
    }); } catch(e){}
    clearTimers(); idx=0; runRoute();
  });
})();
</script>
</body>
</html>

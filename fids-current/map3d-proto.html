<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D Route Map — Prototype (progress + airline colors)</title>
<link rel="stylesheet" href="/mapcdn/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;background:#05080f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;}
  #map{position:absolute;inset:0;}
  #frame{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 3px rgba(120,160,250,.25);}
  #phase{position:absolute;left:18px;top:16px;z-index:5;color:#cfe0ff;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    background:rgba(8,14,30,.55);backdrop-filter:blur(6px);padding:8px 14px;border:1px solid rgba(120,160,250,.3);border-radius:8px;}
  #route{position:absolute;right:18px;top:16px;z-index:5;color:#fff;text-align:right;
    background:rgba(8,14,30,.55);backdrop-filter:blur(6px);padding:8px 14px;border:1px solid rgba(120,160,250,.3);border-radius:8px;}
  #route .big{font-size:22px;font-weight:800;}
  #route .sub{font-size:12px;color:#9fb6e0;font-weight:600;}
  #route .air{font-size:12px;font-weight:800;letter-spacing:.04em;margin-top:2px;}
  .maplibregl-ctrl-attrib{display:none !important;}
  .end-label{color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;
    background:rgba(8,14,30,.6);padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.18);transform:translateY(-22px);}
  .end-dot{width:14px;height:14px;border-radius:50%;background:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.35),0 0 14px rgba(96,165,250,.9);}
  .end-dot.dest{background:#f87171;box-shadow:0 0 0 4px rgba(248,113,113,.35),0 0 14px rgba(248,113,113,.9);}
  #ctl{position:absolute;left:18px;bottom:18px;z-index:6;background:rgba(8,14,30,.66);backdrop-filter:blur(8px);
    border:1px solid rgba(120,160,250,.3);border-radius:12px;padding:12px 14px;color:#cdd7e6;max-width:min(94vw,560px);}
  #ctl .grp{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:5px 0;}
  #ctl .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7e8ca3;width:62px;flex:0 0 62px;font-weight:700;}
  #ctl button{appearance:none;background:#1c2536;color:#cdd7e6;border:1px solid #2a3344;border-radius:7px;padding:6px 11px;cursor:pointer;font-size:12px;font-weight:600;}
  #ctl button.on{background:#2f6df6;border-color:#2f6df6;color:#fff;}
  #ctl .sw{width:24px;height:24px;border-radius:6px;padding:0;border:2px solid rgba(255,255,255,.25);}
  #ctl .sw.on{border-color:#fff;box-shadow:0 0 0 2px #2f6df6;}
</style>
</head>
<body>
  <div id="map"></div>
  <div id="frame"></div>
  <div id="phase">3D Terrain</div>
  <div id="route"><div class="big" id="rtCode">—</div><div class="sub" id="rtCity">—</div><div class="air" id="rtAir">—</div></div>
  <div id="ctl">
    <div class="grp"><span class="lbl">Base</span>
      <button data-base="hybrid" class="on">Sat + Labels</button>
      <button data-base="satellite">Satellite</button>
      <button data-base="voyager">Streets</button>
      <button data-base="topo">Topo</button>
      <button data-base="dark">Dark</button>
    </div>
    <div class="grp"><span class="lbl">To-go line</span>
      <button data-line="solid" class="on">Solid</button>
      <button data-line="dashed">Dashed</button>
      <button data-line="dotted">Dotted</button>
    </div>
    <div class="grp"><span class="lbl">Flown</span><span id="swatches"></span></div>
    <div class="grp"><span class="lbl">Plane</span>
      <button data-plane="3d" class="on">3D Model</button><button data-plane="flat">Flat icon</button><button data-plane="none">None</button>
    </div>
  </div>
<script src="/mapcdn/maplibre-gl.js"></script>
<script src="/mapcdn/three.min.js"></script>
<script src="/mapcdn/gltf-loader.js"></script>
<script>
(function(){
  'use strict';
  var TO_R=Math.PI/180, TO_D=180/Math.PI;

  // Each route carries its airline + brand colour (from airline-colors.js values).
  var ROUTES=[
    { o:[-123.184,49.197], d:[-114.020,51.131], oc:'YVR', dc:'YYC', oCity:'Vancouver', dCity:'Calgary', air:'Air Canada', col:'#D82F2E', tag:'Over the Rockies' },
    { o:[-114.020,51.131], d:[-119.378,49.956], oc:'YYC', dc:'YLW', oCity:'Calgary',   dCity:'Kelowna', air:'WestJet',    col:'#00ABC2', tag:'Rockies → Okanagan' },
    { o:[-123.184,49.197], d:[-119.378,49.956], oc:'YVR', dc:'YLW', oCity:'Vancouver', dCity:'Kelowna', air:'Porter',     col:'#3F6FB5', tag:'Coast Mountains' }
  ];
  var COLORS=[ {n:'Auto',c:null}, {n:'Sky',c:'#5fa8ff'}, {n:'White',c:'#ffffff'}, {n:'Gold',c:'#FAC120'}, {n:'Red',c:'#ef4444'}, {n:'Green',c:'#34d399'}, {n:'Violet',c:'#a78bfa'} ];

  var S={ line:'solid', flown:null /*null = auto/airline*/, plane:'3d' };
  var HAS_THREE = (typeof THREE!=='undefined');
  // Orientation tweak knobs (adjustable after a visual check, blind build):
  var HEADING_OFFSET = Math.PI/2;    // maps compass bearing → model yaw (flipped: was flying backwards)
  var HEADING_SIGN   = -1;
  var PLANE_SIZE     = 1;            // model is built in metres; scale 1:1
  var TARGET_METERS  = 9000;         // real glTF auto-scaled to this size
  var MODEL_FACING   = Math.PI/2;    // base yaw so the glTF nose points +X (like the built model)

  function greatCircle(a,b,n){
    var lon1=a[0]*TO_R, lat1=a[1]*TO_R, lon2=b[0]*TO_R, lat2=b[1]*TO_R;
    var dd=2*Math.asin(Math.sqrt(Math.pow(Math.sin((lat2-lat1)/2),2)+Math.cos(lat1)*Math.cos(lat2)*Math.pow(Math.sin((lon2-lon1)/2),2)));
    if(dd===0) return [a.slice(),b.slice()];
    var pts=[];
    for(var i=0;i<=n;i++){
      var f=i/n, A=Math.sin((1-f)*dd)/Math.sin(dd), B=Math.sin(f*dd)/Math.sin(dd);
      var x=A*Math.cos(lat1)*Math.cos(lon1)+B*Math.cos(lat2)*Math.cos(lon2);
      var y=A*Math.cos(lat1)*Math.sin(lon1)+B*Math.cos(lat2)*Math.sin(lon2);
      var z=A*Math.sin(lat1)+B*Math.sin(lat2);
      pts.push([Math.atan2(y,x)*TO_D, Math.atan2(z,Math.sqrt(x*x+y*y))*TO_D]);
    }
    return pts;
  }
  function bearing(a,b){
    var y=Math.sin((b[0]-a[0])*TO_R)*Math.cos(b[1]*TO_R);
    var x=Math.cos(a[1]*TO_R)*Math.sin(b[1]*TO_R)-Math.sin(a[1]*TO_R)*Math.cos(b[1]*TO_R)*Math.cos((b[0]-a[0])*TO_R);
    return (Math.atan2(y,x)*TO_D+360)%360;
  }
  function lerp(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
  function splitAt(L,t){
    if(L.length<2) return {flown:L.slice(),remain:L.slice(),pos:L[0]||[0,0],brg:0};
    var f=Math.max(0,Math.min(1,t))*(L.length-1), k=Math.min(Math.floor(f),L.length-2), frac=f-k;
    var pt=lerp(L[k],L[k+1],frac);
    return { flown:L.slice(0,k+1).concat([pt]), remain:[pt].concat(L.slice(k+1)), pos:pt, brg:bearing(L[k],L[k+1]) };
  }

  function icon(style){
    var s=96,c=document.createElement('canvas');c.width=c.height=s;
    var x=c.getContext('2d');x.translate(s/2,s/2);x.fillStyle='#ffffff';x.strokeStyle='rgba(20,30,55,.55)';x.lineWidth=2;x.lineJoin='round';
    if(style===0){x.beginPath();x.moveTo(0,-40);x.lineTo(5,-16);x.lineTo(5,-6);x.lineTo(42,10);x.lineTo(42,18);x.lineTo(5,12);x.lineTo(5,30);x.lineTo(16,38);x.lineTo(16,44);x.lineTo(0,40);x.lineTo(-16,44);x.lineTo(-16,38);x.lineTo(-5,30);x.lineTo(-5,12);x.lineTo(-42,18);x.lineTo(-42,10);x.lineTo(-5,-6);x.lineTo(-5,-16);x.closePath();}
    else if(style===1){x.beginPath();x.moveTo(0,-44);x.lineTo(4,-8);x.lineTo(38,28);x.lineTo(38,36);x.lineTo(4,20);x.lineTo(10,40);x.lineTo(0,36);x.lineTo(-10,40);x.lineTo(-4,20);x.lineTo(-38,36);x.lineTo(-38,28);x.lineTo(-4,-8);x.closePath();}
    else {x.beginPath();x.moveTo(0,-42);x.lineTo(30,36);x.lineTo(0,20);x.lineTo(-30,36);x.closePath();}
    x.fill();x.stroke();return x.getImageData(0,0,s,s);
  }

  var map=new maplibregl.Map({
    container:'map',maxZoom:13,attributionControl:false,
    style:{version:8,
      sources:{
        sat:{type:'raster',tiles:['/tiles/satellite/{z}/{x}/{y}.png'],tileSize:256,attribution:''},
        labels:{type:'raster',tiles:['/tiles/labels/{z}/{x}/{y}.png'],tileSize:256,attribution:''},
        dem:{type:'raster-dem',tiles:['/demtiles/{z}/{x}/{y}.png'],tileSize:256,encoding:'terrarium',maxzoom:13}
      },
      layers:[
        {id:'bg',type:'background',paint:{'background-color':'#05080f'}},
        {id:'sat',type:'raster',source:'sat',paint:{'raster-fade-duration':300}},
        {id:'hills',type:'hillshade',source:'dem',paint:{'hillshade-exaggeration':0.55,'hillshade-shadow-color':'#0b1426','hillshade-highlight-color':'#ffffff'}},
        {id:'labels',type:'raster',source:'labels',layout:{visibility:'visible'},paint:{'raster-fade-duration':200}}
      ]},
    center:[-119,50],zoom:6,pitch:0,bearing:0
  });

  var endMarkers=[];
  function clearMarkers(){endMarkers.forEach(function(m){m.remove();});endMarkers=[];}
  function addEnd(coord,code,city,isDest){
    var el=document.createElement('div');
    var lab=document.createElement('div');lab.className='end-label';lab.textContent=code+' · '+city;
    var dot=document.createElement('div');dot.className='end-dot'+(isDest?' dest':'');
    el.appendChild(lab);el.appendChild(dot);
    endMarkers.push(new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(coord).addTo(map));
  }

  var line=[],planeStart=0,planeDur=17000,planeRunning=false,curRoute=null;
  function flownColor(){ return S.flown || (curRoute?curRoute.col:'#5fa8ff'); }

  // ── 3D plane model (three.js, MapLibre custom layer) ──
  var planeState={ pos:[0,0], alt:3000, yaw:0, show:HAS_THREE };
  var planeGroup=null, planeAccent=null, planeProcedural=null, planeModel=null;
  function buildProcedural(){
    var body=new THREE.Group();
    var white=new THREE.MeshStandardMaterial({color:0xeef2f8,metalness:0.45,roughness:0.45});
    var accent=new THREE.MeshStandardMaterial({color:0xD82F2E,metalness:0.35,roughness:0.5});
    var dark=new THREE.MeshStandardMaterial({color:0x222a36,metalness:0.4,roughness:0.6});
    var fus=new THREE.Mesh(new THREE.CylinderGeometry(700,700,7000,18),white); fus.rotation.z=Math.PI/2; body.add(fus);
    var nose=new THREE.Mesh(new THREE.ConeGeometry(700,1700,18),white); nose.rotation.z=-Math.PI/2; nose.position.x=4350; body.add(nose);
    var tail=new THREE.Mesh(new THREE.ConeGeometry(620,1500,18),white); tail.rotation.z=Math.PI/2; tail.position.x=-4000; body.add(tail);
    var wing=new THREE.Mesh(new THREE.BoxGeometry(1900,180,12500),accent); wing.position.x=-200; body.add(wing);
    var tp=new THREE.Mesh(new THREE.BoxGeometry(1200,150,4800),accent); tp.position.x=-3500; body.add(tp);
    var fin=new THREE.Mesh(new THREE.BoxGeometry(1400,2100,160),accent); fin.position.set(-3500,950,0); body.add(fin);
    var win=new THREE.Mesh(new THREE.BoxGeometry(5200,260,260),dark); win.position.set(300,360,0); body.add(win);
    planeAccent=accent; return body;
  }
  function buildPlane3D(){
    var pivot=new THREE.Group();
    planeProcedural=buildProcedural();
    pivot.add(planeProcedural);
    planeGroup=pivot;
    loadRealModel(pivot);
    return pivot;
  }
  function loadRealModel(pivot){
    if(!HAS_THREE || typeof THREE.GLTFLoader!=='function') return;
    try{
      new THREE.GLTFLoader().load('/models/a320neo.glb', function(gltf){
        var model=gltf.scene;
        var box=new THREE.Box3().setFromObject(model), size=new THREE.Vector3(); box.getSize(size);
        var maxDim=Math.max(size.x,size.y,size.z)||1, sc=TARGET_METERS/maxDim;
        model.scale.setScalar(sc);
        var c=new THREE.Vector3(); box.getCenter(c);
        model.position.set(-c.x*sc,-c.y*sc,-c.z*sc);
        model.rotation.y=MODEL_FACING;
        if(planeProcedural){ pivot.remove(planeProcedural); planeProcedural=null; }
        pivot.add(model); planeModel=model;
      }, undefined, function(){ /* keep the built model on failure */ });
    }catch(e){}
  }
  function setPlaneColor(hex){ try{ if(planeAccent) planeAccent.color.set(hex); }catch(e){} }

  var customLayer3d = HAS_THREE ? {
    id:'plane3d', type:'custom', renderingMode:'3d',
    onAdd:function(m,gl){
      this.camera=new THREE.Camera();
      this.scene=new THREE.Scene();
      this.scene.add(new THREE.AmbientLight(0xffffff,0.9));
      var d1=new THREE.DirectionalLight(0xffffff,0.95); d1.position.set(0.4,0.8,0.6); this.scene.add(d1);
      var d2=new THREE.DirectionalLight(0x88aaff,0.35); d2.position.set(-0.5,0.2,-0.4); this.scene.add(d2);
      this.scene.add(buildPlane3D());
      this.renderer=new THREE.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:true});
      this.renderer.autoClear=false;
    },
    render:function(gl,args){
      if(planeState.show && planeGroup){
        planeGroup.rotation.set(0, HEADING_SIGN*planeState.yaw + HEADING_OFFSET, 0);
        var merc=maplibregl.MercatorCoordinate.fromLngLat({lng:planeState.pos[0],lat:planeState.pos[1]}, planeState.alt);
        var s=merc.meterInMercatorCoordinateUnits()*PLANE_SIZE;
        var matArr=(args&&args.defaultProjectionData&&args.defaultProjectionData.mainMatrix)?args.defaultProjectionData.mainMatrix:args;
        var m=new THREE.Matrix4().fromArray(matArr);
        var l=new THREE.Matrix4().makeTranslation(merc.x,merc.y,merc.z)
          .scale(new THREE.Vector3(s,-s,s))
          .multiply(new THREE.Matrix4().makeRotationX(Math.PI/2));
        this.camera.projectionMatrix=m.multiply(l);
        this.renderer.resetState();
        this.renderer.render(this.scene,this.camera);
      }
      map.triggerRepaint();
    }
  } : null;

  function tick(){
    if(map.getSource('flown')){
      var t=planeRunning?(Date.now()-planeStart)/planeDur:0; if(t>1)t=1;
      var sp=splitAt(line,t);
      map.getSource('flown').setData({type:'Feature',geometry:{type:'LineString',coordinates:sp.flown}});
      map.getSource('remain').setData({type:'Feature',geometry:{type:'LineString',coordinates:sp.remain}});
      map.getSource('plane').setData({type:'Feature',properties:{bearing:sp.brg},geometry:{type:'Point',coordinates:sp.pos}});
      // 3D plane state
      planeState.pos=sp.pos;
      planeState.yaw=sp.brg*TO_R;
      var el=0; try{ el=map.queryTerrainElevation({lng:sp.pos[0],lat:sp.pos[1]},{exaggerated:true})||0; }catch(e){}
      planeState.alt=el+2600;
    }
    requestAnimationFrame(tick);
  }

  function applyStyle(){
    if(!map.getLayer('remain')) return;
    var dash={dashed:[2,1.6],dotted:[0.25,2],solid:null}[S.line];
    map.setPaintProperty('remain','line-dasharray',dash);
    map.setPaintProperty('remain','line-width',S.line==='dotted'?4:3);
    var fc=flownColor();
    map.setPaintProperty('flown','line-color',fc);
    map.setPaintProperty('flown-glow','line-color',fc);
    setPlaneColor(fc);
    var mode=S.plane; if(mode==='3d' && !HAS_THREE) mode='flat';
    if(map.getLayer('plane')){
      map.setLayoutProperty('plane','visibility', mode==='flat'?'visible':'none');
      if(mode==='flat') map.setLayoutProperty('plane','icon-image','plane0');
    }
    planeState.show = (mode==='3d');
  }

  function setRoute(r){
    curRoute=r; line=greatCircle(r.o,r.d,160);
    if(!map.getSource('remain')){
      map.addSource('remain',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:line}}});
      map.addSource('flown',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:[r.o]}}});
      // remaining path — faded white, dashed (the "to-go")
      map.addLayer({id:'remain',type:'line',source:'remain',layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':'#ffffff','line-opacity':0.55,'line-width':3,'line-dasharray':[2,1.6]}});
      // flown path — brand colour, glow + solid (the "done")
      map.addLayer({id:'flown-glow',type:'line',source:'flown',layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':r.col,'line-width':11,'line-opacity':0.3,'line-blur':6}});
      map.addLayer({id:'flown',type:'line',source:'flown',layout:{'line-cap':'round','line-join':'round'},
        paint:{'line-color':r.col,'line-width':5}});
      map.addSource('plane',{type:'geojson',data:{type:'Feature',properties:{bearing:0},geometry:{type:'Point',coordinates:r.o}}});
      map.addLayer({id:'plane',type:'symbol',source:'plane',
        layout:{'icon-image':'plane0','icon-rotate':['get','bearing'],'icon-rotation-alignment':'map','icon-pitch-alignment':'map',
          'icon-allow-overlap':true,'icon-ignore-placement':true,'icon-size':['interpolate',['linear'],['zoom'],5,0.45,8,0.8,11,1.3]}});
      if(customLayer3d && !map.getLayer('plane3d')){ try{ map.addLayer(customLayer3d); }catch(e){} }
    }
    applyStyle();
    clearMarkers(); addEnd(r.o,r.oc,r.oCity,false); addEnd(r.d,r.dc,r.dCity,true);
    document.getElementById('rtCode').textContent=r.oc+'  →  '+r.dc;
    document.getElementById('rtCity').textContent=r.oCity+' to '+r.dCity+' · '+r.tag;
    var ae=document.getElementById('rtAir'); ae.textContent=r.air; ae.style.color=r.col;
  }
  function routeBounds(r){var b=new maplibregl.LngLatBounds();greatCircle(r.o,r.d,32).forEach(function(p){b.extend(p);});return b;}

  var ph=document.getElementById('phase'); var idx=0,timers=[];
  function later(fn,ms){timers.push(setTimeout(fn,ms));}
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function run(){
    var r=ROUTES[idx%ROUTES.length]; setRoute(r);
    var brg=bearing(r.o,r.d);
    ph.textContent='3D Terrain';
    map.jumpTo({center:r.o,zoom:7.7,pitch:76,bearing:brg}); planeRunning=false;
    later(function(){ planeStart=Date.now();planeRunning=true;
      map.easeTo({center:r.d,zoom:7.7,pitch:76,bearing:brg,duration:planeDur,easing:function(t){return t<.5?2*t*t:-1+(4-2*t)*t;}});
    },700);
    later(function(){ ph.textContent='Flat 2D';
      var cam=null; try{cam=map.cameraForBounds(routeBounds(r),{padding:{top:110,bottom:90,left:90,right:90},maxZoom:9});}catch(e){}
      var to={pitch:0,bearing:0,duration:7000}; to.zoom=cam?Math.max(6.6,Math.min(cam.zoom||7.4,8)):7.2; to.center=cam?cam.center:r.d;
      map.easeTo(to);
    },18200);
    later(function(){ idx++; run(); },27500);
  }

  function buildSwatches(){
    var wrap=document.getElementById('swatches');
    COLORS.forEach(function(co,i){
      var b=document.createElement('button');
      if(co.c===null){ b.textContent='Auto'; b.style.padding='6px 10px'; b.className=(i===0?'on':''); }
      else { b.className='sw'; b.style.background=co.c; b.title=co.n; }
      b.addEventListener('click',function(){
        S.flown=co.c; applyStyle();
        wrap.querySelectorAll('button').forEach(function(e){e.classList.remove('on');}); b.classList.add('on');
      });
      wrap.appendChild(b);
    });
  }
  function wireGroup(attr,fn){
    document.querySelectorAll('#ctl button['+attr+']').forEach(function(b){
      b.addEventListener('click',function(){
        document.querySelectorAll('#ctl button['+attr+']').forEach(function(e){e.classList.remove('on');});
        b.classList.add('on'); fn(b.getAttribute(attr));
      });
    });
  }

  map.on('load',function(){
    try{ for(var i=0;i<3;i++) map.addImage('plane'+i,icon(i),{pixelRatio:2}); }catch(e){}
    try{ map.setTerrain({source:'dem',exaggeration:1.6}); }catch(e){}
    try{ map.setSky({'sky-color':'#0a1736','sky-horizon-blend':0.55,'horizon-color':'#1a3b6e','horizon-fog-blend':0.5,'fog-color':'#070b14','fog-ground-blend':0.55}); }catch(e){}
    buildSwatches();
    wireGroup('data-base',function(v){ try{ var p=(v==='hybrid')?'satellite':v; map.getSource('sat').setTiles(['/tiles/'+p+'/{z}/{x}/{y}.png']); if(map.getLayer('labels')) map.setLayoutProperty('labels','visibility',v==='hybrid'?'visible':'none'); }catch(e){} });
    wireGroup('data-line',function(v){S.line=v;applyStyle();});
    wireGroup('data-plane',function(v){S.plane=v;applyStyle();});
    requestAnimationFrame(tick);
    clearTimers(); idx=0; run();
  });
})();
</script>
</body>
</html>

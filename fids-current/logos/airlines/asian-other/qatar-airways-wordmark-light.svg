<!-- Qatar Airways wordmark: the lettering ALONE, Latin and Arabic, no
     oryx. Drawn by the owner; path data unchanged, recoloured to the
     brand guideline (burgundy Pantone 229 C #662046, grey Pantone
     430 C #818A8F).

     NOT /logos/wordmarks/QR.svg — that file is a LOCKUP, the words
     with the oryx beside them, and a lockup in the wordmark slot is
     what v23350 had to revert. This slot wants letters only. -->

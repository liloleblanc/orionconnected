<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Gate Tabs — shape mockup</title>
<style>
  :root { --navy:#142a52; --navy2:#1d3a6b; --gate:#1d3a6b; --apw:23%; --skew:-21deg; --gap:14px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#000; font-family:'DM Sans',system-ui,sans-serif; color:#fff; }

  /* ── The header bar (mimics the real gate banner) ── */
  .bar {
    position:relative;
    height:150px;
    background:linear-gradient(180deg,#0f1f3d,#15294e);
    overflow:hidden;
    display:flex;
    align-items:center;
  }
  .airline { font-size:64px; font-weight:800; letter-spacing:-1px; padding-left:34px; }

  /* ── AIRPORT BAND ── */
  .apband {
    position:absolute; top:0; bottom:0;
    right:calc(var(--apw) + var(--gap));
    z-index:3;
    display:flex; align-items:center; justify-content:center;
    padding:0 40px;
    background:rgba(248,250,252,0.97);
    transform:skewX(var(--skew));
    transform-origin:bottom right;
    border-radius:22px 0 0 0;
  }
  .apband .logo { transform:skewX(calc(-1 * var(--skew))); transform-origin:bottom right; color:#142a52; font-weight:800; font-size:22px; text-align:center; line-height:1.05; white-space:nowrap; }

  /* ── GATE TAB ── (full-bleed: touches top + bottom; width = panel below) ── */
  .gatetab {
    position:absolute; top:0; bottom:0; right:0;
    width:var(--apw);
    z-index:2;
    background:var(--gate);
    display:flex; align-items:center; justify-content:center; gap:18px;
    transform:skewX(var(--skew));
    transform-origin:bottom right;
    border-radius:22px 0 0 0;
  }
  .gatetab > * { transform:skewX(calc(-1 * var(--skew))); transform-origin:bottom right; }
  .gatetab .lbl { font-size:34px; font-weight:800; line-height:0.95; }
  .gatetab .num { font-size:88px; font-weight:800; }

  /* ── the panel BELOW the gate tab, to show alignment ── */
  .below { display:flex; }
  .below .spacer { flex:1; }
  .below .panel {
    width:var(--apw);
    height:120px;
    background:#0d1b34;
    border-top:3px solid #2a4a85;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:22px; color:#9db4dd;
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="airline">porter</div>

    <div class="apband">
      <div class="logo">GREATER MONCTON<br>ROMÉO LEBLANC<br>INTERNATIONAL AIRPORT</div>
    </div>

    <div class="gatetab">
      <span class="lbl">Gate<br>Porte</span>
      <span class="num">3</span>
    </div>
  </div>

  <div class="below">
    <div class="spacer"></div>
    <div class="panel">Your Aircraft panel (same width)</div>
  </div>

  <p style="padding:18px 34px;color:#9db4dd;font-size:15px;line-height:1.6;">
    This is an isolated mockup of just the two tabs — it does NOT touch the real gate screen.<br>
    Tweakable: slant angle, gap, corner rounding, width. Tell me what to change here.
  </p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Flight Map — Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#05080f; font-family:'DM Sans',-apple-system,sans-serif; overflow:hidden; }
  #stage { position:absolute; inset:0; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:50; display:flex; gap:10px; align-items:center;
         padding:10px 16px; background:rgba(5,10,20,0.85); backdrop-filter:blur(8px); }
  #bar span { color:#8b96a5; font-size:13px; font-weight:700; letter-spacing:.5px; margin-right:4px; }
  #bar button { background:#1b2230; color:#e6e9ee; border:1px solid #313b4e; border-radius:8px;
                padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  #bar button:hover { background:#252e42; }
  #bar button.on { background:#FAC120; color:#0d2440; border-color:#FAC120; }
  #note { position:fixed; right:16px; top:12px; color:#8b96a5; font-size:12px; z-index:50; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <span>PREVIEW — 3D flight map</span>
  <button data-r="short" class="on">Short haul (YYZ→YHZ)</button>
  <button data-r="rockies">Mountains (YYC→YVR)</button>
  <button data-r="pacific">Ocean (DFW→OGG)</button>
</div>
<div id="note">One-minute cycle: overview → chase → orbit → arrival · loops</div>
<script src="js/map3d.js?v=10"></script>
<script>
(function () {
  var ROUTES = {
    short:   { o:[-79.62,43.68], d:[-63.51,44.88], oc:'YYZ', dc:'YHZ', oCity:'TORONTO', dCity:'HALIFAX',
               airline:'AIR CANADA', fl:'AC614', col:'#D82F2E', progress:0.55, speedKph:850, altFt:36000,
               acType:'Airbus A320', etaStr:'41 min', destWx:'11°C · Cloudy', pos:null },
    rockies: { o:[-114.01,51.12], d:[-123.18,49.19], oc:'YYC', dc:'YVR', oCity:'CALGARY', dCity:'VANCOUVER',
               airline:'WESTJET', fl:'WS707', col:'#00AAA6', progress:0.45, speedKph:790, altFt:34000,
               acType:'Boeing 737 MAX 8', etaStr:'38 min', destWx:'14°C · Rain', pos:null },
    pacific: { o:[-97.04,32.90], d:[-156.43,20.90], oc:'DFW', dc:'OGG', oCity:'DALLAS', dCity:'MAUI',
               airline:'AMERICAN AIRLINES', fl:'AA295', col:'#36495A', progress:0.62, speedKph:880, altFt:38000,
               acType:'Boeing 787-8', etaStr:'2h 46m', destWx:'27°C · Clear', pos:null }
  };
  var stage = document.getElementById('stage');
  function show(key) {
    document.querySelectorAll('#bar button').forEach(function (b) { b.classList.toggle('on', b.dataset.r === key); });
    if (window.GateMap3D) {
      GateMap3D.destroy();
      GateMap3D.mount(stage, ROUTES[key], { cycleMs: 60000 });
    }
  }
  document.querySelectorAll('#bar button').forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.r); });
  });
  show('short');
})();
</script>
</body>
</html>

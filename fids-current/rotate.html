<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YQM Rotating Display</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden;
                 background: #0b1a2b; cursor: none; }
    /* Each board lives in its own iframe, loaded ONCE and kept alive. We only
       toggle which one is visible — no reloads, no re-splash, no drift. */
    .oc-frame {
      position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0;
      margin: 0; padding: 0; display: block;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .45s ease;
      z-index: 1;
    }
    .oc-frame.oc-active {
      opacity: 1; visibility: visible; pointer-events: auto; z-index: 2;
    }
  </style>
</head>
<body>
  <script>
  /* Orion in-place rotator.
     URL: rotate.html?ap=YQM&mode=live&theme=mist[&stream=1]&rotate=fids,gids,bids,gids&dwell=60
       rotate = ordered sequence of boards (aliases: departures/gates/bags, etc.);
                a board may repeat in the sequence (e.g. gates between each).
       dwell  = seconds per screen (default 60).
     Every OTHER param (ap, mode, theme, stream, …) is forwarded to each board.
     All boards load up front and stay loaded; switching is just a class toggle,
     so the timer stays exact and nothing reloads between screens. */
  (function () {
    try {
      var q = new URLSearchParams(window.location.search);

      var rot = (q.get('rotate') || 'fids,gids,bids').trim();
      var dwell = parseInt(q.get('dwell') || q.get('every') || '60', 10);
      if (!(dwell > 0)) dwell = 60;

      var MAP = {
        fids: 'fids.html', departures: 'fids.html', dep: 'fids.html', flights: 'fids.html',
        gids: 'gids.html', gates: 'gids.html', gate: 'gids.html',
        bids: 'bids.html', bags: 'bids.html', bag: 'bids.html', baggage: 'bids.html'
      };

      // Ordered sequence of pages (repeats allowed), collapsing accidental
      // back-to-back duplicates so a screen never "switches to itself".
      var seq = rot.split(',').map(function (s) { return MAP[s.trim().toLowerCase()]; }).filter(Boolean);
      seq = seq.filter(function (p, i) { return i === 0 || p !== seq[i - 1]; });
      if (seq.length === 0) seq = ['fids.html'];

      // Params passed to each board: everything EXCEPT the rotator's own controls
      // (so the boards don't try to rotate themselves).
      q.delete('rotate'); q.delete('dwell'); q.delete('every');
      var childQ = q.toString();
      var childSuffix = childQ ? ('?' + childQ) : '';

      // Tell a board iframe whether it's the one on display. The gate board
      // pauses its heavy gate-cycle re-render while it's hidden — otherwise it
      // keeps rebuilding every 15s in the background, jamming the shared main
      // thread and freezing the rotation. Sent on load + on every switch.
      function ocTell(frame, on) {
        try { frame.contentWindow.postMessage({ oc: on ? 'active' : 'inactive' }, '*'); } catch (e) {}
      }

      // One iframe per UNIQUE page (gids appears once even if it recurs in seq).
      var frameFor = {};
      var uniquePages = seq.filter(function (p, i) { return seq.indexOf(p) === i; });
      uniquePages.forEach(function (page) {
        var f = document.createElement('iframe');
        f.className = 'oc-frame';
        f.setAttribute('scrolling', 'no');
        f.setAttribute('allow', 'autoplay');
        // when it finishes loading, tell it whether it's currently on display
        f.addEventListener('load', function () { ocTell(f, f.classList.contains('oc-active')); });
        f.src = page + childSuffix;
        document.body.appendChild(f);
        frameFor[page] = f;
      });

      var idx = 0;
      frameFor[seq[0]].classList.add('oc-active');
      ocTell(frameFor[seq[0]], true);

      if (seq.length < 2) return; // single board — nothing to rotate

      // The actual switch: cheap class toggle (cross-fade) + active/inactive ping.
      function advance() {
        var cur = frameFor[seq[idx]];
        idx = (idx + 1) % seq.length;
        var nxt = frameFor[seq[idx]];
        if (nxt !== cur) {
          nxt.classList.add('oc-active'); cur.classList.remove('oc-active');
          ocTell(cur, false); ocTell(nxt, true);
        }
      }

      // The gate board runs a continuous map render loop; because same-origin
      // iframes share the main thread, a main-thread setTimeout can get starved
      // and the rotation "sticks" on the gate. Drive the clock from a Web Worker
      // (its own thread — never frozen by board rendering); it posts a tick and
      // the main thread does the cheap toggle at its next yield. Fall back to a
      // drift-corrected setTimeout if Workers/CSP are unavailable.
      var driven = false;
      try {
        var _wsrc = 'var d=' + (dwell * 1000) + ';setInterval(function(){postMessage(1);}, d);';
        var _w = new Worker(URL.createObjectURL(new Blob([_wsrc], { type: 'application/javascript' })));
        _w.onmessage = advance;
        driven = true;
      } catch (e) { /* fall through to setTimeout */ }
      if (!driven) {
        var t0 = Date.now(), step = 0;
        var tick = function () {
          advance(); step++;
          window.setTimeout(tick, Math.max(250, (t0 + (step + 1) * dwell * 1000) - Date.now()));
        };
        window.setTimeout(tick, dwell * 1000);
      }
    } catch (e) { /* if anything fails, the first board still shows */ }
  })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orion Rotating Display</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; overflow: hidden;
                 background: #0b1a2b; cursor: none; }
    /* Each board lives in its own iframe, loaded ONCE and kept alive. We only
       toggle which one is visible — no reloads, no re-splash, no drift. */
    /* v23166 — A DELIBERATE FADE THROUGH BLACK, IN BOTH DIRECTIONS.
       (Nick: 'i just dont want flashes and glitches' / 'transitions could simply
       be less or fade it more fade to black then onwards'.)

       What this used to do was NOT a cross-fade, despite the name. `visibility`
       was not in the transition list, so the moment a board lost .oc-active its
       visibility flipped to hidden INSTANTLY while its opacity was still 1 — the
       outgoing board did not fade at all, it vanished in one frame. The incoming
       board then rose from opacity 0 over .45s. Measured live on v23165 mid-
       switch: `fids.html: opacity 1, visibility hidden` — proof the board was
       already gone before its fade had moved. So every switch was a hard cut to
       bare #0b1a2b followed by a fade-up: a dark BLINK, four times a cycle, and
       worst against the light mist boards.

       Now the fade is symmetric and intentional. Deferring `visibility` by the
       fade duration keeps the outgoing board PAINTED while it fades out, so it
       leaves the screen as smoothly as the next one arrives, and the switch
       reads as one considered fade to black rather than a snap. */
    .oc-frame {
      position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0;
      margin: 0; padding: 0; display: block;
      opacity: 0; visibility: hidden; pointer-events: none;
      /* leaving: fade out fully, THEN stop painting */
      transition: opacity var(--oc-fade, .6s) ease, visibility 0s linear var(--oc-fade, .6s);
      z-index: 1;
    }
    .oc-frame.oc-active {
      opacity: 1; visibility: visible; pointer-events: auto; z-index: 2;
      /* arriving: start painting immediately, then fade in */
      transition: opacity var(--oc-fade, .6s) ease, visibility 0s linear 0s;
    }
  </style>
</head>
<body>
  <script>
  /* Orion in-place rotator.
     URL: rotate.html?ap=YQM&mode=live&theme=mist[&stream=1]&rotate=fids,gids,bids,gids&dwell=60
       rotate = ordered sequence of boards (aliases: departures/gates/bags, etc.);
                a board may repeat in the sequence (e.g. gates between each).
       dwell  = seconds per screen (default 60).
       ap     = ONE airport, or a comma list (ap=YHZ,BOS,LHR) for an AIRPORT TOUR:
                the board sequence plays through for each airport in turn, and the
                next airport is loaded behind the current one so the switch is the
                same calm fade as a board switch — no splash, no loader.
       tour=1 = tour the default list of airports that run on their own
                authority feeds (below); tour=0 opts out. stream=2 (the second
                YouTube stream) tours by default unless ap is already a list.
     Every OTHER param (mode, theme, stream, …) is forwarded to each board.
     Boards load up front and stay loaded; switching is just a class toggle,
     so the timer stays exact and nothing reloads between screens. */
  (function () {
    try {
      var q = new URLSearchParams(window.location.search);

      var rot = (q.get('rotate') || 'fids,gids,bids').trim();
      var dwell = parseInt(q.get('dwell') || q.get('every') || '60', 10);
      if (!(dwell > 0)) dwell = 60;

      // v23166 — FADE LENGTH IS TUNABLE FROM THE URL, so the look can be judged
      // on the real screen instead of guessed at in CSS. ?fade=SECONDS sets each
      // half of the transition (out, then in); ?hold=SECONDS is the rest on black
      // between them. Defaults are a calm 0.6s out / 0.2s black / 0.6s in — slow
      // enough to read as intentional, which is the opposite of a flash.
      // The CSS reads --oc-fade, so both halves stay in step automatically.
      var fadeSec = parseFloat(q.get('fade') || '0.6');
      if (!(fadeSec >= 0 && fadeSec <= 5)) fadeSec = 0.6;
      var holdSec = parseFloat(q.get('hold') || '0.2');
      if (!(holdSec >= 0 && holdSec <= 5)) holdSec = 0.2;
      var FADE_MS = Math.round(fadeSec * 1000);
      var HOLD_MS = Math.round(holdSec * 1000);
      document.documentElement.style.setProperty('--oc-fade', fadeSec + 's');

      var MAP = {
        fids: 'fids.html', departures: 'fids.html', dep: 'fids.html', flights: 'fids.html',
        gids: 'gids.html', gates: 'gids.html', gate: 'gids.html',
        bids: 'bids.html', bags: 'bids.html', bag: 'bids.html', baggage: 'bids.html'
      };

      // Ordered sequence of pages (repeats allowed), collapsing accidental
      // back-to-back duplicates so a screen never "switches to itself".
      var seq = rot.split(',').map(function (s) { return MAP[s.trim().toLowerCase()]; }).filter(Boolean);
      seq = seq.filter(function (p, i) { return i === 0 || p !== seq[i - 1]; });
      if (seq.length === 0) seq = ['fids.html'];

      // ── v23333 — THE AIRPORT TOUR ────────────────────────────────────────
      // (Nick: 'change the stream to cities that do work … keep Canadian
      // cities in there and some US, maybe London and more international'.)
      // The second YouTube stream was pinned to Miami, which has had no data
      // since AeroDataBox went away. This is the list it tours instead: every
      // airport here runs on its own authority's feed. Edit the list, ship,
      // and the running stream picks it up on its own (see the self-refresh
      // below) — nothing to touch on the server.
      var TOUR_DEFAULT = [
        // Canada
        'YHZ', 'YYT', 'YOW', 'YQB', 'YYC', 'YEG', 'YYJ', 'YXE',
        // United States
        'BOS', 'ORD', 'SFO', 'SEA', 'DEN', 'LAS', 'AUS', 'SLC', 'PHL', 'MSP',
        // Europe
        'LHR', 'DUB', 'EDI', 'KEF'
      ];
      var apRaw = String(q.get('ap') || '').toUpperCase();
      var aps = apRaw.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return /^[A-Z0-9]{3,4}$/.test(s); });
      var tourFlag = q.get('tour');
      if (tourFlag === '1' || (q.get('stream') === '2' && aps.length < 2 && tourFlag !== '0')) aps = TOUR_DEFAULT.slice();
      if (aps.length === 0) aps = ['YQM'];
      var isTour = aps.length > 1;

      // Params passed to each board: everything EXCEPT the rotator's own controls
      // (so the boards don't try to rotate themselves). On a tour the airport is
      // set per frame, and `langs` is dropped so each board speaks its own
      // airport's languages (en/fr in Canada, en/es where the board says so).
      q.delete('rotate'); q.delete('dwell'); q.delete('every');
      q.delete('fade'); q.delete('hold');   // rotator-only controls, v23166
      q.delete('tour'); q.delete('ap');
      if (isTour) q.delete('langs');
      var childQ = q.toString();
      function childUrl(page, ap) {
        var p = new URLSearchParams(childQ);
        p.set('ap', ap);
        return page + '?' + p.toString();
      }

      // Tell a board iframe whether it's the one on display. The gate board
      // pauses its heavy gate-cycle re-render while it's hidden — otherwise it
      // keeps rebuilding every 15s in the background, jamming the shared main
      // thread and freezing the rotation. Sent on load + on every switch.
      function ocTell(frame, on) {
        try { frame.contentWindow.postMessage({ oc: on ? 'active' : 'inactive' }, '*'); } catch (e) {}
      }

      // One iframe per (airport, unique page). A single-airport run keeps every
      // page loaded, as before. A tour keeps TWO airports alive at most: the one
      // on screen (all its pages) and the next one's first page, loaded during
      // the current airport's last screen so it is painted and populated before
      // it is ever shown; the previous airport's frames are removed once its
      // fade-out has finished.
      var frames = {};   // frames[ap][page] → iframe
      var uniquePages = seq.filter(function (p, i) { return seq.indexOf(p) === i; });
      function ensureFrame(ap, page) {
        frames[ap] = frames[ap] || {};
        if (frames[ap][page]) return frames[ap][page];
        var f = document.createElement('iframe');
        f.className = 'oc-frame';
        f.setAttribute('scrolling', 'no');
        f.setAttribute('allow', 'autoplay');
        f.setAttribute('data-oc-ap', ap);
        f.setAttribute('data-oc-page', page);
        // when it finishes loading, tell it whether it's currently on display
        f.addEventListener('load', function () { f._ocLoadedAt = Date.now(); ocTell(f, f.classList.contains('oc-active')); });
        f.src = childUrl(page, ap);
        document.body.appendChild(f);
        frames[ap][page] = f;
        return f;
      }
      function ensureAirport(ap) { uniquePages.forEach(function (p) { ensureFrame(ap, p); }); }
      function destroyAirport(ap) {
        var set = frames[ap]; if (!set) return;
        Object.keys(set).forEach(function (p) {
          var f = set[p];
          if (f.classList.contains('oc-active')) return;   // never pull the visible board
          try { ocTell(f, false); } catch (e) {}
          // Removing the iframe unloads its document; no src swap needed.
          try { f.parentNode && f.parentNode.removeChild(f); } catch (e) {}
          delete set[p];
        });
        if (!Object.keys(set).length) delete frames[ap];
      }
      // A board is ready to be SHOWN when it has revealed its chrome (fids/bids
      // stamp data-fids-chrome-ready once painted) or the gate layout exists;
      // failing those signals, 45 s after its load event is as long as we wait.
      // v23337 — THE STREAM NEVER SHOWS AN EMPTY BOARD (Nick: "a stream with
      // empty pages = no views and potentially a bad impression"). Even an
      // airport with a perfectly good feed is empty at 3am its time — Moncton,
      // Gander and Deer Lake all were when this was written. So an airport is
      // skipped for this lap when its first board has loaded and has nothing on
      // it, and it comes back on the next lap when its day starts. Fails open:
      // if the board can't be inspected we show it rather than skip everything.
      function hasFlights(f) {
        try {
          var d = f.contentDocument;
          if (!d) return true;
          if (d.querySelector('#fidsTable tbody tr, .b3-row, .bidsv2-flight-row')) return true;
          if (d.querySelector('.g8-wrap .g8-r1-flightnum')) return true;   // gate screen with a flight
          var empty = d.getElementById('panelEmpty');
          if (empty && empty.offsetParent !== null) return false;          // the board itself says it is empty
          return true;
        } catch (e) { return true; }
      }
      function isReady(f) {
        try {
          var d = f.contentDocument;
          if (d) {
            if (d.documentElement.hasAttribute('data-fids-chrome-ready')) return true;
            if (d.querySelector('.g8-wrap .g8-r1')) return true;
          }
        } catch (e) {}
        return !!(f._ocLoadedAt && (Date.now() - f._ocLoadedAt) > 45000);
      }

      var apIdx = 0, idx = 0;
      ensureAirport(aps[0]);
      frames[aps[0]][seq[0]].classList.add('oc-active');
      ocTell(frames[aps[0]][seq[0]], true);
      if (isTour && seq.length === 1) ensureFrame(aps[1 % aps.length], seq[0]);   // one-page tours preload right away

      if (seq.length < 2 && !isTour) return; // single board, single airport — nothing to rotate

      // ── Self-refresh (v23333) ────────────────────────────────────────────
      // The stream box loads this page once and keeps it for weeks; only the
      // boards inside reload themselves on a build-tag change. So this page
      // checks its own ETag every 30 minutes and, when the deployed copy has
      // changed, reloads at the next switch — a new tour list or rotator fix
      // reaches the running stream without a hand on the server.
      var selfSig = null, reloadPending = false;
      function checkSelf() {
        try {
          fetch(window.location.pathname + '?_oc=' + Date.now(), { method: 'HEAD', cache: 'no-store' }).then(function (r) {
            if (!r || !r.ok) return;
            var sig = r.headers.get('etag') || r.headers.get('last-modified') || '';
            if (!sig) return;
            if (selfSig === null) selfSig = sig;
            else if (sig !== selfSig) reloadPending = true;
          }, function () {});
        } catch (e) {}
      }
      checkSelf();
      setInterval(checkSelf, 30 * 60000);

      // ── Timing ────────────────────────────────────────────────────────────
      // Every screen shows for at least `dwell`. A non-gate board (fids/bids)
      // advances exactly at dwell. The GATE runs an ad carousel whose slides are
      // UNEVEN in length (map ~60s, hotel ~31s, standard ~22s), so advancing on a
      // fixed clock chops whatever ad is mid-play. Instead the gate posts
      // {ocGateBoundary:true} the instant each ad finishes; we switch away only on
      // the first boundary AT/AFTER dwell — the gate always ends on a clean ad
      // boundary (never cut) and naturally stretches to fit whole ads. `maxMs` is
      // a hard cap so the rotation can never freeze on the gate if boundaries stop.
      var GATE = 'gids.html';
      var minMs = dwell * 1000;
      var maxMs = Math.max(minMs * 3, minMs + 120000);
      var READY_GRACE_MS = 40000;   // how long an airport switch may wait for the next board to be ready
      var slotStart = Date.now();

      // v23166 — THE SWITCH IS SEQUENCED: OUT TO BLACK, THEN IN.
      // (Nick: 'transitions could simply be less or fade it more fade to black
      // then onwards ... i just dont want flashes and glitches'.)
      //
      // Both classes used to be toggled in the same frame. Combined with the
      // visibility bug in the CSS above, that made the outgoing board disappear
      // instantly — a blink. Even with the CSS fixed, toggling both at once
      // gives two overlapping fades, and for the middle of that overlap BOTH
      // boards are semi-transparent, so the page ground still shows through and
      // the change still dips.
      //
      // Sequencing removes the overlap entirely: the current board fades all the
      // way out, the screen rests on black, and only then does the next board
      // fade up. Nothing is ever half-transparent over anything else, so there
      // is no dip to be seen — just one deliberate fade, which is what was asked
      // for. It also means the incoming board gets the whole fade-out to finish
      // its own catch-up work off-screen before anyone can see it.
      // THIS RUNS 24/7 UNATTENDED, SO THE SECOND HALF MUST NOT DEPEND ON A
      // setTimeout (Nick: 'just remember about the stream and that it is running
      // 24/7'). These boards are same-origin iframes sharing ONE main thread —
      // that is exactly how the rotation got stuck before, when the gate's
      // render loop starved the parent's timer and the switch never came (which
      // is why the dwell clock was moved into a Web Worker). If the fade-in
      // timer were starved the same way now, the stream would sit on BLACK,
      // which is far worse than the blink this replaces.
      //
      // So the reveal is recorded as a DUE TIME, not a callback. The timer is
      // just the fast path; the worker heartbeat below re-checks every second
      // and performs any reveal that is overdue. Both routes call the same
      // idempotent function, so whichever arrives first wins and the other is a
      // no-op. A starved timer now costs at most one extra second of black
      // instead of ending the rotation.
      var pendingShow = null;   // {frame, dueAt, retireAp} — a reveal that has not happened yet

      function showNow() {
        if (!pendingShow) return;
        var f = pendingShow.frame, retire = pendingShow.retireAp;
        pendingShow = null;
        if (!f.classList.contains('oc-active')) {
          f.classList.add('oc-active');
          ocTell(f, true);
        }
        slotStart = Date.now();          // the dwell starts when it is VISIBLE
        if (retire) {
          // The previous airport is fully off screen: free its frames, and
          // finish loading the rest of this airport's pages behind the one
          // now showing.
          setTimeout(function () { try { destroyAirport(retire); } catch (e) {} }, 1500);
          ensureAirport(aps[apIdx]);
        }
        // Entering the current airport's LAST screen: start the next airport's
        // first board now, so it has this whole dwell to load and populate.
        if (isTour && idx === seq.length - 1) ensureFrame(aps[(apIdx + 1) % aps.length], seq[0]);
      }

      // Returns false when the switch must wait (next airport's board not ready
      // yet, within grace) so the heartbeat retries a second later.
      function advance() {
        if (pendingShow) return true;    // a switch is already in flight
        var curAp = aps[apIdx];
        var cur = frames[curAp][seq[idx]];
        var nextIdx = (idx + 1) % seq.length;
        var nextAp = (isTour && nextIdx === 0) ? aps[(apIdx + 1) % aps.length] : curAp;
        if (reloadPending && nextAp !== curAp) { window.location.reload(); return true; }
        var nxt = ensureFrame(nextAp, seq[nextIdx]);
        if (nextAp !== curAp && !isReady(nxt) && (Date.now() - slotStart) < minMs + READY_GRACE_MS) return false;
        // v23337 — skip an airport whose board has loaded with nothing on it,
        // and try the one after it. Bounded by the roster length so a quiet
        // night everywhere still shows a board rather than stalling on black.
        if (nextAp !== curAp && isTour && isReady(nxt) && !hasFlights(nxt)) {
          for (var _s = 0; _s < aps.length - 1; _s++) {
            var _skipped = nextAp;
            apIdx = (apIdx + 1) % aps.length;
            nextAp = aps[apIdx];
            if (nextAp === curAp) { apIdx = (apIdx + 1) % aps.length; nextAp = aps[apIdx]; }
            try { console.log('[TOUR] skipping', _skipped, '— no flights on its board right now; trying', nextAp); } catch (e) {}
            try { destroyAirport(_skipped); } catch (e) {}
            nxt = ensureFrame(nextAp, seq[nextIdx]);
            if (!isReady(nxt)) return false;            // give the new one a tick to load
            if (hasFlights(nxt)) break;
          }
          apIdx = (apIdx - 1 + aps.length) % aps.length;  // the switch below advances it
        }
        var retire = null;
        if (nextAp !== curAp) { retire = curAp; apIdx = (apIdx + 1) % aps.length; }
        idx = nextIdx;
        slotStart = Date.now();
        if (nxt === cur) return true;
        // 1. fade the current board out; tell it immediately so it can pause its
        //    janitors while it is on its way off screen.
        cur.classList.remove('oc-active');
        ocTell(cur, false);
        // 2. once it is fully out (screen is black), bring the next one up.
        pendingShow = { frame: nxt, dueAt: Date.now() + FADE_MS + HOLD_MS, retireAp: retire };
        setTimeout(showNow, FADE_MS + HOLD_MS);
        return true;
      }

      // A gate ad just finished. If we're on the gate and past the minimum, switch
      // NOW — exactly on the boundary, so nothing is cut. Boundaries before the
      // minimum are ignored (we never advance mid-ad).
      window.addEventListener('message', function (ev) {
        var d = ev && ev.data;
        if (!d || !d.ocGateBoundary) return;
        if (pendingShow) return;   // a switch is already in flight (v23166)
        if (seq[idx] === GATE && (Date.now() - slotStart) >= minMs) advance();
      });

      // Clock lives in a Web Worker (own thread — board rendering can't starve it,
      // which used to make the rotation "stick"). It heartbeats every second; the
      // main thread makes the cheap decision. Non-gate boards advance at dwell;
      // the gate advance is boundary-driven above, with maxMs as a safety net.
      function beat() {
        // WATCHDOG FIRST (v23166). The worker runs on its own thread, so this
        // tick arrives even when the boards have the main thread pinned. If a
        // reveal is overdue — its setTimeout was starved, or the host throttled
        // it — perform it here. This is the guarantee that the 24/7 stream can
        // never come to rest on a black screen: the worst case is that black
        // lasts a fraction of a second longer than intended.
        if (pendingShow && Date.now() >= pendingShow.dueAt) showNow();
        if (pendingShow) return;   // mid-transition: don't stack another switch
        var elapsed = Date.now() - slotStart;
        if (seq[idx] === GATE) {
          if (elapsed >= maxMs) advance();
        } else if (elapsed >= minMs) {
          advance();
        }
      }
      var driven = false;
      try {
        var _wsrc = 'setInterval(function(){postMessage(1);}, 1000);';
        var _w = new Worker(URL.createObjectURL(new Blob([_wsrc], { type: 'application/javascript' })));
        _w.onmessage = beat;
        driven = true;
      } catch (e) { /* fall through to setInterval */ }
      if (!driven) { window.setInterval(beat, 1000); }
      // Exposed for verification only (read-only view of the rotation state).
      window.__ocRotator = { get: function () { return { aps: aps, apIdx: apIdx, idx: idx, seq: seq, isTour: isTour, frames: Object.keys(frames).map(function (a) { return a + ':' + Object.keys(frames[a]).join('+'); }), pending: !!pendingShow, reloadPending: reloadPending }; } };
    } catch (e) { /* if anything fails, the first board still shows */ }
  })();
  </script>
</body>
</html>

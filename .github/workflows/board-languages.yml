# Board languages: MAIN's guard on every pull request.
#
# A pull request carries its own copy of the board-languages guard, and the
# "Repository checks" workflow runs from the pull request too, so on its own a
# change could loosen a check, make a script exit early, or delete the step.
# This workflow is the one that decides, and a pull request cannot touch it:
#
#   - pull_request_target: GitHub runs this file as it is on MAIN, never the
#     pull request's copy of it;
#   - it checks out main (main's tests/i18n/as-main.js, checks, tests and
#     approvals) and, beside it, the pull request merged into main
#     (refs/pull/N/merge, the tree main would become);
#   - main's as-main.js lays the change's passenger files, workers, ledger and
#     frozen keys over main and runs main's board-languages tests, main's
#     `npm run guard` and main's rendered check (tests/render/words.mjs).
#
# Its job is "board-languages (main's guard)". To make a red run stop a merge,
# it is a required status check of the "Protect main" ruleset, beside "test"
# (docs/BOARD-LANGUAGES.md, section 7).
#
# Safety: no secret is used, the token is read-only and is not kept in either
# checkout, and the pull request's own policy.js is read as data by a node
# with no permission to write or spawn (as-main.js). The change's page code
# runs only as pages and data under main's tests, as it does in every run of
# the boards' own test suite.
name: Board languages (main's guard)

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: board-languages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  board-languages:
    name: board-languages (main's guard)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Main, with its guard
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: guard
          # the guard compares the change with main's history (the ledger and
          # the exceptions may only shrink)
          fetch-depth: 0
          persist-credentials: false
      - name: The pull request, merged into main
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: change
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Board languages, as main enforces them
        run: node guard/tests/i18n/as-main.js --change change

name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the board-languages ledger is compared with main's (it may only
          # shrink), so the job needs main's history, not a shallow clone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm test
      - run: npm run assets:check
      # The OpenSky relay runs on Ubuntu 24.04's Python 3.12, not on the
      # latest one set up above: run its tests on that version too. After
      # the steps that use Python, which keep the latest one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: OpenSky relay on the server's Python (3.12)
        env:
          OSKY_RELAY_REQUIRE_PY: "3.12"
        run: node --test tests/opensky-relay.test.js
      # main's own board-languages guard on this change, from a worktree of
      # origin/main: never this checkout's copy of it.
      - name: Board languages, as main enforces them
        if: github.event_name == 'pull_request'
        env:
          # npm test above already read the screens; the deciding run reads them with main's check
          I18N_AS_MAIN_RENDER: '0'
        run: |
          if git cat-file -e origin/main:tests/i18n/as-main.js 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/main-guard" origin/main
            node "$RUNNER_TEMP/main-guard/tests/i18n/as-main.js" --change "$GITHUB_WORKSPACE"
          else
            echo "main has no board-languages guard yet: this change introduces it"
          fi

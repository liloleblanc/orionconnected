name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the board-languages ledger is compared with main's (it may only
          # shrink), so the job needs main's history, not a shallow clone
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm test
      - run: npm run assets:check
      # main's own board-languages guard on this change: a pull request cannot
      # pass by loosening its copy of the guard (tests/i18n/as-main.js)
      - name: Board languages, as main enforces them
        run: node tests/i18n/as-main.js
